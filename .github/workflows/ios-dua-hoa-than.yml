name: iOS IPA - Dua Hoa Than
on:
  push:
    branches: [ios-build]
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Make Capacitor iOS project
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          mkdir www && cp ../prototypes/dua-hoa-than/index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.vtagames.duahoathan","appName":"DuaHoaThan","webDir":"www",
           "ios":{"contentInset":"never","scrollEnabled":false,"backgroundColor":"#000000"}}
          JSON
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          P=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleDisplayName Đua Hóa Thân" $P || $PB -c "Add :CFBundleDisplayName string Đua Hóa Thân" $P
          $PB -c "Delete :UISupportedInterfaceOrientations" $P || true
          $PB -c "Add :UISupportedInterfaceOrientations array" $P
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" $P
          $PB -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" $P
          $PB -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          $PB -c "Add :UISupportedInterfaceOrientations~ipad array" $P
          $PB -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" $P
          $PB -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" $P
          $PB -c "Add :UIRequiresFullScreen bool true" $P || true
          $PB -c "Add :UIStatusBarHidden bool true" $P || true
          $PB -c "Set :UIViewControllerBasedStatusBarAppearance false" $P || $PB -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $P
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Build unsigned app
        run: |
          cd app/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=1 build | tail -30
      - name: Pack IPA
        run: |
          cd app/ios/App
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          cd out && zip -qry ../../../../DuaHoaThan.ipa Payload
          ls -la ../../../../DuaHoaThan.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DuaHoaThan-ipa
          path: DuaHoaThan.ipa
