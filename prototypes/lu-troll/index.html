<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=450,GR=0.6,SPD=4,JMP=12.2;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  document.getElementById('rot').style.display=innerHeight>innerWidth?'block':'none';}
addEventListener('resize',fit);fit();

// ---------- ÂM THANH (tự sáng tác bằng WebAudio) ----------
let AC=null,master=null,muted=false,nextT=0,step=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
const MEL=[[67,1],[0,1],[67,1],[69,1],[67,1],[64,1],[60,2],
           [62,1],[0,1],[62,1],[64,1],[63,1],[62,1],[55,2],
           [67,1],[0,1],[67,1],[69,1],[67,1],[64,1],[72,1],[71,1],
           [70,1],[69,1],[68,1],[67,1],[60,1],[0,1],[60,2]];
const MELMAP={};(()=>{let i=0;for(const [m,l] of MEL){if(m)MELMAP[i]=[m,l];i+=l;}})();
const ROOTS=[48,43,48,43];
function initAudio(){
  try{
    if(AC){AC.resume();return;}
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);
    nextT=AC.currentTime+0.1;setInterval(sched,25);
  }catch(e){AC=null;}
}
function tone(m,t,d,type,vol,slide){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(mf(m),t);if(slide)o.frequency.exponentialRampToValueAtTime(mf(m+slide),t+d);
  g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);
}
function noise(t,d,vol){
  const b=AC.createBuffer(1,Math.floor(AC.sampleRate*d),AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='highpass';f.frequency.value=6000;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
function trollActive(){return P&&(P.rev>0||P.swap>0||P.gd<0||(L&&L.mirror>0));}
function sched(){
  if(!AC)return;
  if(state==='dead'){nextT=Math.max(nextT,AC.currentTime+0.05);return;}
  const bpm=[150,166,182][lvl]||150,e8=60/bpm/2;
  while(nextT<AC.currentTime+0.12){
    const i=step%32,bar=Math.floor(i/8),j=i%8,tr=trollActive()?-5:0;
    const ev=MELMAP[i];if(ev)tone(ev[0]+tr,nextT,ev[1]*e8*0.85,'square',0.07);
    if(j===0||j===4)tone(ROOTS[bar]+tr,nextT,e8*0.8,'triangle',0.22);
    if(j===2||j===6)tone(ROOTS[bar]+7+tr,nextT,e8*0.55,'triangle',0.14);
    if(j%2===1)noise(nextT,0.03,0.05);
    step++;nextT+=e8;
  }
}
const SFX={
  jump(){if(!AC)return;tone(72,AC.currentTime,0.12,'square',0.07,7);},
  bone(){if(!AC)return;const t=AC.currentTime;tone(84,t,0.06,'square',0.07);tone(91,t+0.06,0.12,'square',0.07);},
  stomp(){if(!AC)return;tone(64,AC.currentTime,0.15,'square',0.09,-12);},
  boing(){if(!AC)return;tone(55,AC.currentTime,0.5,'triangle',0.2,24);},
  taunt(){if(!AC)return;const t=AC.currentTime;[79,76,81,79,76].forEach((m,k)=>tone(m,t+k*0.13,0.12,'square',0.08));},
  fanfare(){if(!AC)return;const t=AC.currentTime;[60,64,67,72].forEach((m,k)=>tone(m,t+k*0.12,k===3?0.5:0.12,'square',0.09));},
  die(){
    if(!AC)return;let tt=AC.currentTime+0.05;
    [[55,.36],[54,.36],[53,.36],[52,1.1]].forEach(([m,d],k)=>{
      const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(mf(m),tt);
      f.type='lowpass';f.frequency.value=1100;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(0.2,tt+0.04);
      g.gain.setValueAtTime(0.2,tt+d-0.07);g.gain.linearRampToValueAtTime(0,tt+d);
      if(k===3){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=6;lg.gain.value=5;l.connect(lg);lg.connect(o.frequency);l.start(tt);l.stop(tt+d);}
      o.connect(f);f.connect(g);g.connect(master);o.start(tt);o.stop(tt+d+0.02);tt+=d;});
  }
};
document.getElementById('mute').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();initAudio();muted=!muted;
  if(master)master.gain.value=muted?0:0.5;e.currentTarget.textContent=muted?'🔇':'🔊';});
addEventListener('pointerdown',initAudio);addEventListener('keydown',initAudio);

// ---------- ĐIỀU KHIỂN ----------
const K={l:0,r:0,j:0};let jPrev=0;
const km={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j'};
addEventListener('keydown',e=>{if(km[e.key]){K[km[e.key]]=1;e.preventDefault();}});
addEventListener('keyup',e=>{if(km[e.key]){K[km[e.key]]=0;e.preventDefault();}});
function bind(id,k){const el=document.getElementById(id);
  const on=e=>{e.preventDefault();K[k]=1},off=e=>{e.preventDefault();K[k]=0};
  el.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,off));}
bind('bl','l');bind('br','r');bind('bj','j');
document.addEventListener('contextmenu',e=>e.preventDefault());

const MSG={
  q:'Khối ? cho quà… quà là quái đó anh 😆',
  hidden:'Khối tàng hình! Ai biểu nhảy cao chi 🤭',
  fake:'Đất giả đó, nhìn kỹ chưa mà bước 😝',
  sign:'Bảng ghi "an toàn" mà cũng tin hả 🤣',
  rock:'Trời rớt cục đá! Đi chậm chút anh ơi 🪨',
  cloud:'Mây biết cắn đó nha 😬',
  spike:'Gai mọc ngay dưới chân nè 🌵',
  enemy:'Bị quái cắn rồi! 🐸',
  pit:'Té sông rồi 💦',
  rev:'Ăn nấm troll, nút bị ngược rồi 🍄',
  crush:'Ham lượm xương, bị khối đè dẹp lép 🥞',
  spiky:'Con này có gai, đạp chi trời 🦔',
  spring:'Lò xo bắn thẳng lên gai 🤸',
  fish:'Cá lóc phóng lên đớp! 🐟',
  fallplat:'Gạch rớt theo luôn, đứng chi lâu 🧱',
  rocket:'Có gì bay từ sau lưng tới kìa 🚀',
  fakewin:'Tưởng về đích hả? Giỡn thôi 😜',
  sky:'Lộn ngược rồi té lên trời luôn 🙃',
  mirror:'Màn hình lật gương, hoa mắt chưa 🪞',
  swap:'Cờ lưu giả! Nút bị đổi chỗ rồi 😝',
  jumpspike:'Hố giả đó, đi bộ qua được mà nhảy chi 🤭',
  dark:'Tối thui thấy đường đâu mà đi 🌚',
  mud:'Bùn trơn, trượt một mạch xuống sông 🛝',
  bees:'Bị ong rượt chích sưng mỏ 🐝',
  fakeend:'Màn hình phá đảo cũng giả nốt 🤣',
  split:'Đạp 1 con ra 3 con 🤯'
};

// ---------- MÀN CHƠI ----------
const G=(s,a,b)=>s.push({x:a,y:400,w:b-a,h:50,t:'ground'});
const wall=(s,x)=>s.push({x,y:120,w:100,h:330,t:'ground'});
const mkEn=(x,o={})=>Object.assign({x,y:374,w:30,h:26,vx:-1,vy:0,alive:true,sq:0},o);
const boneRow=(a,b,y,st=34)=>{const r=[];for(let x=a;x<=b;x+=st)r.push({x,y});return r;};

function lv1(){
  const s=[];
  G(s,0,880);G(s,1020,1300);
  s.push({x:1300,y:400,w:120,h:50,t:'fake'});
  G(s,1420,2150);G(s,2560,3900);wall(s,3900);
  s.push({x:520,y:280,w:40,h:40,t:'brick'},{x:560,y:280,w:40,h:40,t:'q',kind:'enemy'},{x:600,y:280,w:40,h:40,t:'brick'});
  s.push({x:930,y:290,w:40,h:40,t:'hidden',vis:false});
  s.push({x:1150,y:360,w:40,h:40,t:'brick'},{x:1190,y:320,w:40,h:80,t:'brick'});
  s.push({x:2180,y:330,w:80,h:22,t:'cloud'},{x:2290,y:300,w:80,h:22,t:'cloud',evil:true},{x:2400,y:330,w:80,h:22,t:'cloud'});
  s.push({x:3110,y:280,w:40,h:40,t:'brick'},{x:3150,y:280,w:40,h:40,t:'q',kind:'bone'},{x:3190,y:280,w:40,h:40,t:'brick'});
  return {name:'Màn 1 – Khởi động',w:4000,cp:2000,s,sky:['#5fb6ec','#bfe6fa'],hill:'#6cbf6a',
    en:[760,1900,3000,3320].map(x=>mkEn(x)),
    traps:[{k:'rock',trig:1580},{k:'spike',a:2740,b:2850,x:2720,w:140,h:0}],
    bones:[...boneRow(1500,1600,362),...boneRow(2700,2800,362)],
    signs:[{x:120,text:'Màn khởi động thôi 😊'}],
    flag:{x:3480,to:3850,trig:170},nextTxt:'Màn 2 có 10 cái bẫy 😈'};
}

function lv2(){
  const s=[];
  G(s,0,600);
  s.push({x:600,y:400,w:120,h:50,t:'fake',sign:true});
  G(s,720,1000);
  s.push({x:780,y:280,w:40,h:40,t:'brick'},{x:820,y:280,w:40,h:40,t:'q',kind:'shroom'},{x:860,y:280,w:40,h:40,t:'brick'});
  G(s,1130,1700);G(s,1700,1880);
  s.push({x:1880,y:400,w:40,h:50,t:'spring'});
  G(s,1920,2100);
  s.push({x:2200,y:360,w:80,h:20,t:'fallplat'});
  G(s,2400,2820);
  s.push({x:2820,y:400,w:240,h:50,t:'fake',manual:true,grp:'fw'});
  G(s,3060,3930);
  s.push({x:3930,y:400,w:90,h:50,t:'fake'});
  G(s,4020,4300);wall(s,4300);
  return {name:'Màn 2 – Đập máy',w:4400,cp:2050,s,sky:['#f08a4b','#ffd59a'],hill:'#5c9e57',
    en:[mkEn(1580,{spiky:true}),mkEn(2520),mkEn(3300),mkEn(3480,{spiky:true}),mkEn(3620)],
    traps:[
      {k:'crusher',x:1300,y:140,w:60,h:60,st:0,vy:0},
      {k:'spikebar',x:1830,y:40,w:210},
      {k:'fish',x:2330},
      {k:'rocket',trig:2650},
      {k:'fakewin',x:2930,t:-1}
    ],
    bones:boneRow(1240,1420,362,36),
    signs:[{x:470,text:'Khúc này an toàn 👍'},{x:1180,text:'Lượm xương đi nè 🦴'},{x:2720,text:'Đích ➜ tới rồi!'}],
    flag:{x:3820,to:4110,trig:150},nextTxt:'Màn 3 đổi luật chơi luôn 🙃'};
}

function lv3(){
  const s=[];
  G(s,0,760);G(s,880,1200);
  s.push({x:580,y:280,w:40,h:40,t:'brick'},{x:620,y:280,w:40,h:40,t:'q',kind:'mirror'},{x:660,y:280,w:40,h:40,t:'brick'});
  s.push({x:1100,y:0,w:350,h:40,t:'ceil'},{x:1560,y:0,w:140,h:40,t:'ceil'},{x:1790,y:0,w:220,h:40,t:'ceil'});
  G(s,1880,2150);
  s.push({x:2150,y:400,w:250,h:50,t:'mud'});
  G(s,2520,2760);G(s,2860,3080);
  s.push({x:3080,y:400,w:120,h:50,t:'invis'});
  G(s,3200,3500);
  s.push({x:3500,y:400,w:80,h:50,t:'fake'});
  G(s,3580,4280);
  s.push({x:4100,y:340,w:40,h:60,t:'brick'});
  G(s,4380,4620);
  s.push({x:4620,y:400,w:180,h:50,t:'fake',manual:true,grp:'fe'});
  G(s,4800,5300);wall(s,5300);
  return {name:'Màn 3 – Đổi luật',w:5400,cp:3000,s,sky:['#3a2a6b','#b48fd8'],hill:'#4f7f5a',
    en:[mkEn(450,{split:true}),mkEn(3400),mkEn(3700),mkEn(4900),mkEn(5000,{split:true})],
    traps:[
      {k:'fakecp',x:2600,t:-1},
      {k:'jumpspike',x:3040,y:250,w:200,a:3030,b:3220},
      {k:'bees',trig:3900,stop:4620},
      {k:'fakeend',x:4700,t:-1}
    ],
    bones:[...boneRow(950,1120,362),{x:1165,y:362,flip:-1},...boneRow(1200,1400,56),...boneRow(1600,1680,56),{x:1930,y:56,flip:1},...boneRow(2200,2380,362)],
    dark:{a:3280,b:3880},
    signs:[{x:100,text:'Màn 3: luật chơi đổi rồi 😇'},{x:880,text:'Xương ngon nè 🦴'},{x:2930,text:'Nhảy qua hố nha 👉'},{x:3220,text:'Phía trước hơi tối 🌚'},{x:4420,text:'Đích đó, chạy lẹ!'}],
    flag:{x:5050,to:5230,trig:150},nextTxt:''};
}
const LEVELS=[lv1,lv2,lv3];

// ---------- TRẠNG THÁI ----------
let lvl=0,L,P,camX=0,deaths=0,bones=0,cpX=60,state='title',deadT=0,cause='',frame=0,lvDeaths=0;

function build(){
  L=LEVELS[lvl]();
  L.fx=[];L.items=[];L.hint='';L.hintT=-999;L.toast={text:'',n:0};L.flag.run=false;L.mirror=0;L.fakeEnd=false;
  FXL=[];P={land:0,x:cpX,y:300,w:28,h:28,vx:0,vy:0,on:false,face:1,st:null,rev:0,swap:0,spr:false,gd:1,slip:false};
  if(state!=='title')state='play';
}
function nextLevel(){lvl++;cpX=60;lvDeaths=0;build();}

const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function solid(o){
  if(o.t==='hidden')return o.vis;
  if(o.t==='fake'||o.t==='fallplat')return !o.fall;
  if(o.t==='cloud')return false;
  return true;
}
function hint(h){L.hint=h;L.hintT=frame;}
function toast(t,n=90,taunt){L.toast={text:t,n};if(taunt){SFX.taunt();FXL=FXL.filter(f=>f.k!=='excl');spawnFx('excl',P.x+14,P.y+20,{follow:true,scale:0.85});}}
function die(c){if(state!=='play')return;state='dead';deadT=0;cause=c;deaths++;lvDeaths++;spawnFx('spark',P.x+14,P.y+14,{flip:P.face>0});spawnFx('poof',P.x+14,P.y+30,{scale:0.55});P.vy=-10*P.gd;P.rev=0;P.swap=0;L.mirror=0;SFX.die();}
function inDark(){return L.dark&&P.x>L.dark.a&&P.x<L.dark.b;}

function bump(o){
  if(o.t!=='q')return;
  o.t='used';o.bt=8;
  const dir=P.x>o.x?1:-1;
  if(o.kind==='enemy')L.en.push(mkEn(o.x+5,{y:o.y-28,vx:dir*2.6,vy:-7,fast:true}));
  else if(o.kind==='shroom')L.items.push({x:o.x+7,y:o.y-28,w:26,h:26,vx:dir*2,vy:-6});
  else if(o.kind==='mirror'){L.mirror=330;toast('🪞 Gương troll! Màn hình bị LẬT 5 giây',100,true);}
  else{bones++;SFX.bone();L.fx.push({x:o.x+12,y:o.y-10,t:0});}
}
function physBody(e,cloudOk){
  e.vy=Math.min(e.vy+GR,14);e.x+=e.vx;
  for(const o of L.s){if(solid(o)&&ov(e,o)){e.x=e.vx>0?o.x-e.w:o.x+o.w;e.vx=-e.vx;}}
  e.y+=e.vy;
  for(const o of L.s){if((solid(o)||(cloudOk&&o.t==='cloud'))&&ov(e,o)){if(e.vy>0){e.y=o.y-e.h;e.vy=0;}else{e.y=o.y+o.h;e.vy=0;}}}
}

function update(){
  frame++;
  if(state==='title'||state==='win'||state==='clear'){
    if(K.j&&!jPrev){
      if(state==='clear'){state='play';nextLevel();}
      else{if(state==='win'){deaths=0;bones=0;lvl=0;}cpX=60;lvDeaths=0;state='play';build();}
    }
    jPrev=K.j;return;
  }
  if(state==='dead'){updFx();P.vy+=GR*P.gd;P.y+=P.vy;deadT++;if(deadT>140)build();jPrev=K.j;return;}
  updFx();if(P.land>0)P.land--;
  if(L.toast.n>0)L.toast.n--;
  if(L.mirror>0)L.mirror--;
  // điều khiển (có thể bị troll)
  let kl=K.l,kr=K.r,kj=K.j;
  if(P.swap>0){P.swap--;const t=kr;kr=kj;kj=t;}
  if(P.rev>0){P.rev--;const t=kl;kl=kr;kr=t;}
  const dx=kr-kl,gd=P.gd;
  const onMud=P.on&&P.st&&P.st.t==='mud';
  if(onMud){P.slip=true;P.vx=clamp((P.vx+dx*0.18)*0.997,-6.5,6.5);}
  else if(P.slip&&!P.on){P.vx=clamp(P.vx+dx*0.08,-6.5,6.5);}
  else{P.slip=false;P.vx=dx*SPD;}
  if(dx)P.face=Math.sign(dx);
  if(kj&&!jPrev&&P.on){P.vy=-JMP*gd;SFX.jump();if(gd>0)spawnFx('land',P.x+14,P.y+28,{scale:0.7});}
  if(!kj&&P.vy*gd<-4&&!P.spr)P.vy=-4*gd;
  if(P.vy*gd>=0)P.spr=false;
  jPrev=kj;
  P.vy=clamp(P.vy+GR*gd,-14,14);
  P.x+=P.vx;if(P.x<0)P.x=0;
  for(const o of L.s){if(solid(o)&&ov(P,o)){if(P.vx>0)P.x=o.x-P.w;else if(P.vx<0)P.x=o.x+o.w;}}
  const prevB=P.y+P.h,wasOn=P.on,vyIn=P.vy;P.y+=P.vy;P.on=false;P.st=null;
  for(const o of L.s){
    if(o.t==='hidden'&&!o.vis){
      if(gd>0&&P.vy<0&&ov(P,o)&&P.y>o.y+o.h-16){o.vis=true;P.y=o.y+o.h;P.vy=1;hint('hidden');}
      continue;
    }
    if(o.t==='cloud'){if(gd>0&&P.vy>=0&&prevB<=o.y+1&&ov(P,o)){P.y=o.y-P.h;P.vy=0;P.on=true;P.st=o;}continue;}
    if(!solid(o)||!ov(P,o))continue;
    if(P.vy>0){P.y=o.y-P.h;P.vy=0;if(gd>0){P.on=true;P.st=o;}}
    else if(P.vy<0){P.y=o.y+o.h;P.vy=0;if(gd<0){P.on=true;P.st=o;}else bump(o);}
  }
  if(P.on&&!wasOn&&vyIn*gd>5){P.land=6;if(gd>0)spawnFx('land',P.x+14,P.y+28);}
  if(P.on&&gd>0&&P.vx!==0&&frame%12===0)spawnFx('dust',P.x+(P.vx>0?6:22),P.y+28,{flip:P.vx<0,scale:P.slip?1.2:0.8});
  const st=P.st;
  if(st){
    if(st.t==='fake'&&!st.fall&&!st.manual){st.fall=true;hint(st.sign?'sign':'fake');}
    if(st.evil){st.bite=true;die('cloud');}
    if(st.t==='spring'){st.used=12;P.vy=-20;P.spr=true;P.on=false;hint('spring');SFX.boing();}
    if(st.t==='fallplat'&&!st.tm)st.tm=1;
    if(st.t==='invis'&&!L.invisMsg){L.invisMsg=1;toast('Hố giả đó 🤭 đi bộ qua được nè',90,true);}
  }
  for(const o of L.s){
    if(o.fall){o.vy=(o.vy||0)+0.6;o.y+=o.vy;}
    if(o.bt)o.bt--;
    if(o.t==='spring'&&o.used)o.used--;
    if(o.t==='fallplat'&&o.tm&&!o.fall){o.tm++;if(o.tm>40){o.fall=true;hint('fallplat');}}
  }
  for(const t of L.traps)trap(t);
  for(const it of L.items){physBody(it,true);if(ov(P,it)){it.dead=true;P.rev=360;toast('🍄 Ăn nấm troll! Nút trái phải bị NGƯỢC 6 giây',100,true);}if(it.y>H+50)it.dead=true;}
  L.items=L.items.filter(i=>!i.dead);
  // xương
  for(const c of L.bones){if(!c.got&&ov(P,{x:c.x-13,y:c.y-12,w:26,h:28})){c.got=true;bones++;SFX.bone();
    if(c.flip){P.gd=c.flip;P.on=false;toast(c.flip<0?'🙃 Lượm xương… TRỜI ĐẤT LỘN NGƯỢC!':'😮‍💨 Lộn lại bình thường rồi',100,true);}}}
  // quái
  for(const e of L.en){
    if(!e.alive){if(e.sq)e.sq--;continue;}
    if(Math.abs(e.x-P.x)>W)continue;
    physBody(e,true);
    if(e.y>H+50){e.alive=false;continue;}
    if(ov(P,e)){
      if(gd>0&&P.vy>0&&P.y+P.h-e.y<16){
        if(e.spiky){e.showSpike=true;die('spiky');}
        else{e.alive=false;e.sq=25;P.vy=-8;SFX.stomp();spawnFx('poof',e.x+e.w/2,e.y+e.h,{scale:e.w/30*0.6});
          if(e.split){[-2.6,2.2,3.4].forEach((v,i)=>L.en.push(mkEn(e.x+i*8,{w:18,h:16,y:e.y+6,vx:v,vy:-7,mini:true})));toast('Đạp 1 con… ra 3 con 🤯',70,true);}}
      }else die(e.mini?'split':e.fast?'q':'enemy');
    }
  }
  L.en=L.en.filter(e=>e.alive||e.sq>0);
  L.fx.forEach(f=>f.t++);L.fx=L.fx.filter(f=>f.t<40);
  const f=L.flag;
  if(!f.run&&P.x>f.x-f.trig)f.run=true;
  if(f.run&&f.x<f.to)f.x=Math.min(f.to,f.x+5);
  if(state==='play'&&ov(P,{x:f.x,y:200,w:12,h:200})){state=lvl<LEVELS.length-1?'clear':'win';SFX.fanfare();}
  if(P.x>L.cp&&cpX<L.cp){cpX=L.cp;toast('🚩 Đã lưu chỗ',60);}
  if(gd>0&&P.y>H+40)die(P.rev>0?'rev':P.swap>0?'swap':L.mirror>0?'mirror':P.slip?'mud':inDark()?'dark':(frame-L.hintT<150&&L.hint?L.hint:'pit'));
  if(gd<0&&P.y<-60)die('sky');
}

function trap(t){
  if(t.k==='rock'){
    if(!t.done&&P.x>t.trig){t.done=true;t.o={x:P.x+70,y:-80,w:44,h:44,vy:8};}
    const r=t.o;if(!r)return;
    r.vy+=1;r.y+=r.vy;if(ov(P,r))die('rock');
    if(r.y+r.h>=400){r.y=356;L.s.push({x:r.x,y:r.y,w:r.w,h:r.h,t:'rockb'});t.o=null;}
  }else if(t.k==='spike'){
    if(!t.on&&P.on&&P.x>t.a&&P.x<t.b){t.on=true;t.n=0;}
    if(t.on){t.n++;if(t.n>8)t.h=Math.min(24,t.h+5);
      if(t.h>0&&ov(P,{x:t.x,y:400-t.h,w:t.w,h:t.h}))die('spike');}
  }else if(t.k==='crusher'){
    if(t.st===0&&P.x+P.w>t.x-6&&P.x<t.x+t.w+6)t.st=1;
    if(t.st===1){t.vy+=1.2;t.y+=t.vy;if(ov(P,t))die('crush');
      if(t.y+t.h>=400){t.y=400-t.h;t.st=2;L.s.push({x:t.x,y:t.y,w:t.w,h:t.h,t:'crushb'});}}
  }else if(t.k==='spikebar'){
    if(ov(P,{x:t.x,y:t.y,w:t.w,h:24}))die('spring');
  }else if(t.k==='fish'){
    if(!t.done&&P.st&&P.st.t==='fallplat'){t.done=true;t.o={x:t.x,y:H,w:26,h:36,vy:-15};}
    const o=t.o;if(!o)return;o.vy+=0.5;o.y+=o.vy;if(ov(P,o))die('fish');if(o.y>H+60)t.o=null;
  }else if(t.k==='rocket'){
    if(!t.done&&P.x>t.trig){t.done=true;t.o={x:camX-50,y:374,w:44,h:20,warn:28};}
    const o=t.o;if(!o)return;
    if(o.warn>0){o.warn--;o.x=camX-50;return;}
    o.x+=8;if(ov(P,o))die('rocket');if(o.x>camX+W+100)t.o=null;
  }else if(t.k==='fakewin'){
    if(t.t<0&&ov(P,{x:t.x,y:200,w:12,h:200})){t.t=0;toast('🎉 VỀ ĐÍCH RỒI!!! ...',45);SFX.fanfare();}
    if(t.t>=0){t.t++;
      if(t.t===45){L.s.forEach(o=>{if(o.grp==='fw')o.fall=true;});toast('...GIỠN THÔI 😜',80,true);hint('fakewin');}}
  }else if(t.k==='fakecp'){
    if(t.t<0&&ov(P,{x:t.x,y:330,w:12,h:70})){t.t=0;toast('🚩 Đã lưu chỗ',50);}
    if(t.t>=0&&t.t<999){t.t++;if(t.t===20){t.t=999;P.swap=480;toast('…xạo đó! Nút NHẢY ⇄ PHẢI đổi chỗ 8 giây 😝',110,true);}}
  }else if(t.k==='jumpspike'){
    if(!t.vis&&!P.on&&P.x>t.a&&P.x<t.b)t.vis=true;
    if(t.vis&&ov(P,{x:t.x,y:t.y,w:t.w,h:22}))die('jumpspike');
  }else if(t.k==='bees'){
    if(!t.o&&!t.done&&P.x>t.trig){t.done=true;t.o={x:camX-90,y:320,w:70,h:70,gone:false};toast('🐝 ONG! CHẠY LẸ!!!',70,true);}
    const o=t.o;if(!o)return;
    if(o.x>t.stop||o.gone){o.gone=true;o.y-=5;o.x+=2;if(o.y<-100)t.o=null;return;}
    o.x+=3.75;o.y=320+Math.sin(frame/8)*20;if(ov(P,{x:o.x+8,y:o.y+8,w:o.w-16,h:o.h-16}))die('bees');
  }else if(t.k==='fakeend'){
    if(t.t<0&&ov(P,{x:t.x,y:300,w:12,h:100})){t.t=0;L.fakeEnd=true;SFX.fanfare();}
    if(t.t>=0&&!t.fell){t.t++;
      if(t.t>20&&(K.l||K.r||K.j)){t.fell=true;L.fakeEnd=false;L.s.forEach(o=>{if(o.grp==='fe')o.fall=true;});toast('Màn hình phá đảo cũng giả nốt 🤣',90,true);hint('fakeend');}}
  }
}

function dogGrid(legs,tail,eye,tongue){
  const g=DOG_BASE.map(r=>r.split(''));

function drawFx(){
  ctx.imageSmoothingEnabled=false;

function drawBG(){
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,L.sky[0]);gr.addColorStop(1,L.sky[1]);
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  if(lvl===2){ctx.fillStyle='#fff8d0';ctx.beginPath();ctx.arc(640-camX*0.05,90,34,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,.75)';
  for(let i=0;i<12;i++){const x=((i*370)-camX*0.4)%(W+300);const xx=x<-150?x+W+300:x;const y=70+(i*53)%110;
    ctx.beginPath();ctx.ellipse(xx,y,40,16,0,0,7);ctx.ellipse(xx+30,y-8,30,16,0,0,7);ctx.ellipse(xx+55,y,32,14,0,0,7);ctx.fill();}
  ctx.fillStyle=L.hill;
  for(let i=0;i<16;i++){const x=i*420-camX*0.6;ctx.beginPath();ctx.ellipse(x,400,170,90,0,Math.PI,0);ctx.fill();}
  for(let i=0;i<12;i++){const x=i*520+200-camX*0.8;ctx.fillStyle='#7a5230';ctx.fillRect(x,300,8,100);
    ctx.fillStyle='#2e8b3e';for(let a=0;a<5;a++){ctx.beginPath();ctx.ellipse(x+4,300,34,8,-0.9+a*0.45,0,7);ctx.fill();}}
}
function drawGround(x,y,w,h){
  ctx.fillStyle='#9a6534';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#4caf50';ctx.fillRect(x,y,w,10);ctx.fillStyle='#388e3c';ctx.fillRect(x,y+10,w,3);
  ctx.fillStyle='#7d4f26';for(let i=x+10;i<x+w;i+=40)ctx.fillRect(i,y+24,6,6);
}
function drawBrick(x,y,w,h){
  ctx.fillStyle='#c8642c';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#7a3510';ctx.lineWidth=2;
  for(let yy=y;yy<y+h;yy+=20){const hh=Math.min(20,y+h-yy);ctx.strokeRect(x,yy,w,hh);ctx.beginPath();ctx.moveTo(x+w/2,yy);ctx.lineTo(x+w/2,yy+hh);ctx.stroke();}
}
function drawSolid(o){
  const x=o.x,y=o.y,w=o.w,h=o.h;
  if(o.t==='ground'||o.t==='fake')drawGround(x,y,w,h);
  else if(o.t==='ceil'){ctx.fillStyle='#9a6534';ctx.fillRect(x,y,w,h);ctx.fillStyle='#4caf50';ctx.fillRect(x,y+h-10,w,10);ctx.fillStyle='#388e3c';ctx.fillRect(x,y+h-13,w,3);}
  else if(o.t==='mud'){ctx.fillStyle='#5d4027';ctx.fillRect(x,y,w,h);ctx.fillStyle='#4a3020';ctx.fillRect(x,y,w,8);
    ctx.fillStyle='#7b5a3c';for(let i=x+12;i<x+w;i+=34){ctx.beginPath();ctx.arc(i+((frame/3+i)%6),y+4,3,0,7);ctx.fill();}}
  else if(o.t==='spring'){
    if(o.used){ctx.fillStyle='#9a6534';ctx.fillRect(x,y+20,w,h-20);ctx.strokeStyle='#bbb';ctx.lineWidth=3;ctx.beginPath();
      for(let i=0;i<5;i++){ctx.moveTo(x+4,y+20-i*8);ctx.lineTo(x+w-4,y+16-i*8);}ctx.stroke();ctx.fillStyle='#e53935';ctx.fillRect(x,y-22,w,6);}
    else drawGround(x,y,w,h);
  }
  else if(o.t==='brick'||o.t==='fallplat'){const sh=o.t==='fallplat'&&o.tm&&!o.fall?(Math.random()-.5)*3:0;drawBrick(x+sh,y,w,h);}
  else if(o.t==='q'){
    const by=Math.sin(frame/8)*1.5;ctx.fillStyle='#f4c430';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#9c6b00';ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);
    ctx.fillStyle='#9c6b00';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText('?',x+w/2,y+30+by);
  }else if(o.t==='used'||(o.t==='hidden'&&o.vis)){
    const off=o.bt?-o.bt/2:0;ctx.fillStyle='#8d6e63';ctx.fillRect(x,y+off,w,h);ctx.strokeStyle='#5d4037';ctx.lineWidth=3;ctx.strokeRect(x+1.5,y+1.5+off,w-3,h-3);
  }else if(o.t==='cloud'){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+20,y+11,22,13,0,0,7);ctx.ellipse(x+42,y+6,24,15,0,0,7);ctx.ellipse(x+62,y+11,20,12,0,0,7);ctx.fill();
    if(o.evil){ctx.fillStyle='#333';ctx.fillRect(x+32,y+3,3,4);ctx.fillRect(x+48,y+3,3,4);}
    if(o.bite){ctx.fillStyle='#c62828';ctx.beginPath();ctx.ellipse(x+42,y+14,18,8,0,0,Math.PI);ctx.fill();
      ctx.fillStyle='#fff';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x+27+i*7,y+14);ctx.lineTo(x+30+i*7,y+20);ctx.lineTo(x+33+i*7,y+14);ctx.fill();}}
  }else if(o.t==='rockb')drawRock(o);
  else if(o.t==='crushb')drawCrusher(o,true);
}
function drawRock(r){ctx.fillStyle='#78797d';rr(r.x,r.y,r.w,r.h,12);ctx.fill();ctx.fillStyle='#5b5c60';ctx.fillRect(r.x+10,r.y+12,10,6);ctx.fillRect(r.x+24,r.y+26,12,6);
  ctx.fillStyle='#222';ctx.fillRect(r.x+12,r.y+18,4,4);ctx.fillRect(r.x+28,r.y+18,4,4);}
function drawCrusher(c,angry){
  drawBrick(c.x,c.y,c.w,c.h);
  if(angry){ctx.fillStyle='#000';ctx.fillRect(c.x+12,c.y+20,8,8);ctx.fillRect(c.x+40,c.y+20,8,8);
    ctx.fillRect(c.x+10,c.y+14,12,3);ctx.fillRect(c.x+38,c.y+14,12,3);ctx.fillStyle='#fff';ctx.fillRect(c.x+14,c.y+40,32,8);}
}
function drawSpikes(x,y,w,h,down){ctx.fillStyle='#9e9e9e';for(let i=0;i<w;i+=14){ctx.beginPath();
  if(down){ctx.moveTo(x+i,y);ctx.lineTo(x+i+7,y+h);ctx.lineTo(x+i+14,y);}else{ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+7,y);ctx.lineTo(x+i+14,y+h);}ctx.fill();}}
function drawBone(x,y,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle='#fff6e0';ctx.strokeStyle='#b89f74';ctx.lineWidth=1.5;
  ctx.fillRect(-9,-3,18,6);
  [[-9,-4],[-9,4],[9,-4],[9,4]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,4.5,0,7);ctx.fill();ctx.stroke();});
  ctx.fillRect(-8,-3,16,6);ctx.restore();
}
function drawBees(o){
  for(let i=0;i<7;i++){const bx=o.x+15+(i*23)%50+Math.sin(frame/3+i)*6,by=o.y+12+(i*17)%48+Math.cos(frame/4+i)*6;
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(bx-2,by-6,5,3,0,0,7);ctx.fill();
    ctx.fillStyle='#fbc02d';ctx.beginPath();ctx.ellipse(bx,by,8,6,0,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(bx-2,by-6,2,12);ctx.fillRect(bx+3,by-5,2,10);}
}
function drawTrap(t){
  if(t.k==='rock'&&t.o)drawRock(t.o);
  else if(t.k==='spike'){if(t.h>0)drawSpikes(t.x,400-t.h,t.w,t.h,false);else if(t.on){ctx.fillStyle='#795548';for(let i=0;i<t.w;i+=20)ctx.fillRect(t.x+i+Math.random()*3,396,6,4);}}
  else if(t.k==='crusher'&&t.st<2)drawCrusher(t,t.st===1);
  else if(t.k==='spikebar'){ctx.fillStyle='#616161';ctx.fillRect(t.x,t.y-8,t.w,8);drawSpikes(t.x,t.y,t.w,22,true);}
  else if(t.k==='fish'&&t.o){const o=t.o;ctx.save();ctx.translate(o.x+13,o.y+18);if(o.vy>0)ctx.scale(1,-1);
    ctx.fillStyle='#4e5b4a';ctx.beginPath();ctx.ellipse(0,0,11,18,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-10,16);ctx.lineTo(0,10);ctx.lineTo(10,16);ctx.lineTo(0,24);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(-6,-10,4,4);ctx.fillRect(3,-10,4,4);ctx.fillStyle='#c62828';ctx.fillRect(-5,-18,10,4);ctx.restore();}
  else if(t.k==='rocket'&&t.o){const o=t.o;
    if(o.warn>0){if(Math.floor(frame/4)%2){ctx.fillStyle='#e53935';ctx.font='bold 34px system-ui';ctx.textAlign='left';ctx.fillText('!',camX+12,390);}return;}
    ctx.fillStyle='#ff9800';ctx.beginPath();ctx.moveTo(o.x,o.y+4);ctx.lineTo(o.x-16-Math.random()*8,o.y+10);ctx.lineTo(o.x,o.y+16);ctx.fill();
    ctx.fillStyle='#455a64';rr(o.x,o.y,o.w,o.h,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(o.x+30,o.y+6,5,5);}
  else if(t.k==='fakewin'){const g=L.s.find(o=>o.grp==='fw');drawFlag(t.x,true,'#ffb300',g?g.y-400:0);}
  else if(t.k==='fakecp')drawFlag(t.x,false);
  else if(t.k==='jumpspike'&&t.vis){ctx.fillStyle='#616161';ctx.fillRect(t.x,t.y-8,t.w,8);drawSpikes(t.x,t.y,t.w,22,true);}
  else if(t.k==='bees'&&t.o)drawBees(t.o);
  else if(t.k==='fakeend'){const g=L.s.find(o=>o.grp==='fe');const dy=g?g.y-400:0;
    ctx.fillStyle='#ddd';ctx.fillRect(t.x,300+dy,5,100);ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(t.x+2.5,300+dy,6,0,7);ctx.fill();
    ctx.fillStyle='#e53935';ctx.beginPath();ctx.moveTo(t.x+5,306+dy);ctx.lineTo(t.x+55+Math.sin(frame/6)*4,322+dy);ctx.lineTo(t.x+5,338+dy);ctx.fill();}
}
function drawEnemy(e){
  const s=e.w/30;ctx.save();ctx.translate(e.x,e.y+e.h-26*s);ctx.scale(s,s);
  if(!e.alive){if(e.sq){ctx.fillStyle='#5e35b1';ctx.fillRect(0,18,30,8);}ctx.restore();return;}
  const step=Math.floor(frame/8)%2;
  ctx.fillStyle=e.fast?'#d84315':'#5e35b1';ctx.beginPath();ctx.ellipse(15,16,15,13,0,Math.PI,0);ctx.fill();ctx.fillRect(0,16,30,6);
  if(e.showSpike)drawSpikes(0,-6,28,10,false);
  ctx.fillStyle='#3a1f6b';ctx.fillRect(3+step*2,22,8,4);ctx.fillRect(19-step*2,22,8,4);
  ctx.fillStyle='#fff';ctx.fillRect(7,7,6,7);ctx.fillRect(17,7,6,7);
  ctx.fillStyle='#000';const d=e.vx>0?2:0;ctx.fillRect(8+d,9,3,4);ctx.fillRect(18+d,9,3,4);
  ctx.restore();
}
function drawShroom(i){ctx.fillStyle='#f5e6c8';ctx.fillRect(i.x+8,i.y+12,10,14);ctx.fillStyle='#8e24aa';ctx.beginPath();ctx.ellipse(i.x+13,i.y+12,13,11,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(i.x+6,i.y+4,4,4);ctx.fillRect(i.x+16,i.y+2,4,4);ctx.fillStyle='#000';ctx.fillRect(i.x+10,i.y+16,2,4);ctx.fillRect(i.x+15,i.y+16,2,4);}
function drawDog(x,y,face,dead){
  ctx.imageSmoothingEnabled=false;
  const troll=P.rev>0||P.swap>0||L.mirror>0;let img;
  if(dead)img=DOGF.dead;
  else if(!P.on)img=(P.vy*P.gd<0)?DOGF.jump:DOGF.fall;
  else if(P.vx!==0){const a=troll?DOGF.dizzyRun:DOGF.run;img=a[Math.floor(frame/5)%4];}
  else{const a=troll?DOGF.dizzyIdle:DOGF.idle;img=a[Math.floor(frame/14)%2];}
  const bob=(!dead&&P.on&&P.vx!==0&&Math.floor(frame/5)%4===2)?-2:0;
  const sq=P.land>0?P.land*0.035:0;
  ctx.save();ctx.translate(x+14,y+28);
  if(face<0)ctx.scale(-1,1);
  if(dead!==(P.gd<0)){ctx.translate(0,-14);ctx.scale(1,-1);ctx.translate(0,14);}
  ctx.scale(1+sq,1-sq);
  ctx.drawImage(img,-18,-28+bob);
  ctx.restore();
}
function drawFlag(x,big,col,dy=0){
  const top=(big?200:330)+dy;ctx.fillStyle='#ddd';ctx.fillRect(x,top,5,(big?200:70));ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(x+2.5,top,6,0,7);ctx.fill();
  const wave=Math.sin(frame/6)*4;ctx.fillStyle=col||(big?'#e53935':'#29b6f6');ctx.beginPath();ctx.moveTo(x+5,top+6);ctx.lineTo(x+(big?60:34)+wave,top+(big?22:14));ctx.lineTo(x+5,top+(big?40:24));ctx.fill();
}
function drawSign(sg){
  ctx.fillStyle='#6d4c2f';ctx.fillRect(sg.x+56,330,6,70);
  ctx.font='bold 13px system-ui';const tw=ctx.measureText(sg.text).width+20;
  ctx.fillStyle='#c79a63';rr(sg.x+59-tw/2,300,tw,32,6);ctx.fill();ctx.strokeStyle='#6d4c2f';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#3e2a17';ctx.textAlign='center';ctx.fillText(sg.text,sg.x+59,321);
}
function centerBox(lines,sub){
  ctx.fillStyle='rgba(0,0,0,.6)';rr(W/2-310,H/2-90,620,170,18);ctx.fill();
  ctx.textAlign='center';ctx.fillStyle='#fff';
  lines.forEach((l,i)=>{ctx.font=(i===0?'bold 34px':'20px')+' system-ui';ctx.fillText(l,W/2,H/2-40+i*42);});
  if(sub){ctx.font='16px system-ui';ctx.fillStyle='#ffe082';ctx.fillText(sub,W/2,H/2+64);}
}
const winBox=()=>centerBox(['🏆 Phá đảo rồi!','Tổng cộng chết '+deaths+' lần · 🦴 '+bones,deaths<=15?'Ghê thiệt, không đập máy luôn!':'Máy còn nguyên là giỏi rồi 😂'],'Bấm nhảy để chơi lại từ đầu');
function draw(){
  camX=Math.max(0,Math.min(L.w-W,P.x-300));
  ctx.save();
  if(L.mirror>0){ctx.translate(W,0);ctx.scale(-1,1);}
  drawBG();
  ctx.save();ctx.translate(-Math.round(camX),0);
  ctx.fillStyle='#4a90c2';ctx.fillRect(camX,430,W,20);
  L.signs.forEach(drawSign);
  drawFlag(L.cp,false);
  for(const o of L.s)if(o.x+o.w>camX-50&&o.x<camX+W+50)drawSolid(o);
  for(const c of L.bones)if(!c.got)drawBone(c.x,c.y+Math.sin(frame/10+c.x)*2,Math.sin(frame/15+c.x)*0.3);
  for(const t of L.traps)drawTrap(t);
  for(const e of L.en)drawEnemy(e);
  L.items.forEach(drawShroom);
  drawFlag(L.flag.x,true);
  if(L.flag.run&&L.flag.x<L.flag.to){ctx.fillStyle='#b9772f';const s=Math.floor(frame/4)%2;ctx.fillRect(L.flag.x-6+s*4,392,5,8);ctx.fillRect(L.flag.x+6-s*4,392,5,8);}
  for(const f of L.fx){ctx.globalAlpha=1-f.t/40;drawBone(f.x+8,f.y-f.t*1.5,f.t/5);ctx.globalAlpha=1;}
  drawDog(P.x,P.y,P.face,state==='dead');
  drawFx();
  if(L.dark){const a=L.dark,cx=P.x+14,inZ=cx>a.a&&cx<a.b;
    if(inZ){const g=ctx.createRadialGradient(cx,P.y+14,40,cx,P.y+14,115);g.addColorStop(0,'rgba(0,0,10,0)');g.addColorStop(1,'rgba(0,0,10,.97)');
      ctx.fillStyle=g;ctx.fillRect(camX,0,W,H);}}
  ctx.restore();
  ctx.restore();
  // HUD
  ctx.textAlign='left';ctx.font='bold 20px system-ui';ctx.fillStyle='rgba(0,0,0,.35)';rr(10,10,210,34,10);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText('💀 '+deaths+'    🦴 '+bones,22,34);
  ctx.textAlign='right';ctx.font='bold 16px system-ui';ctx.fillText('Lu Troll · '+L.name,W-14,30);
  if(state==='play'){
    const eff=[];if(P.rev>0)eff.push('🍄 NÚT NGƯỢC '+Math.ceil(P.rev/60)+'s');if(P.swap>0)eff.push('⇄ NHẢY/PHẢI ĐỔI CHỖ '+Math.ceil(P.swap/60)+'s');
    if(L.mirror>0)eff.push('🪞 LẬT GƯƠNG '+Math.ceil(L.mirror/60)+'s');if(P.gd<0)eff.push('🙃 LỘN NGƯỢC');
    if(eff.length){ctx.textAlign='center';ctx.fillStyle='#ffe0f7';ctx.font='bold 16px system-ui';ctx.fillText(eff.join('   '),W/2,62);}
  }
  if(L.toast.n>0&&state==='play'){ctx.textAlign='center';ctx.font='bold 22px system-ui';const tw=ctx.measureText(L.toast.text).width+30;
    ctx.fillStyle='rgba(0,0,0,.55)';rr(W/2-tw/2,80,tw,40,12);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(L.toast.text,W/2,108);}
  if(L.fakeEnd&&state==='play')winBox();
  if(state==='dead')centerBox(['Gâu! Chết rồi 😵',MSG[cause]||MSG.pit],'Màn này chết '+lvDeaths+' lần · tổng '+deaths);
  if(state==='title')centerBox(['🐶 LU TROLL','3 màn · bẫy khắp nơi',"Đừng tin cái gì hết!"],'Bấm nút nhảy ⤒ (hoặc Space) để bắt đầu · có nhạc 🎵');
  if(state==='clear')centerBox(['✅ Qua '+L.name.split(' –')[0]+'!','Chết '+lvDeaths+' lần. Chưa là gì đâu…',L.nextTxt],'Bấm nhảy để vô màn tiếp');
  if(state==='win')winBox();
  ctx.textAlign='left';ctx.font='11px system-ui';ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillText('© Võ Thái Anh',10,H-8);
}
build();
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
