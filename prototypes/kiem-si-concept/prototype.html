<style>
  :root {
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --bg: #0b0f18;

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0f18; --panel: rgba(10, 14, 24, .82); --text: #e9edf5; --muted: #9aa6bd; --accent: #ffb35c; } }
  :root[data-theme="dark"] { --bg: #0b0f18; --panel: rgba(10, 14, 24, .82); --text: #e9edf5; --muted: #9aa6bd; --accent: #ffb35c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);

    background: var(--panel); border-radius: 12px; padding: 10px 12px; z-index: 5; font-size: 12px; box-sizing: border-box;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #tune[hidden] { display: none; }

<script>
// PROTOTYPE - NOT FOR PRODUCTION
// Question: Chạy, đạp tường và combo 3 nhát bằng nút cảm ứng trên điện thoại cầm ngang có "đã tay" không?
// Date: 2026-11-03
'use strict';

// ============ Thông số chỉnh được (giá trị cứng, chỉnh bằng nút ⚙) ============
const T = {
  runSpeed: 165, groundAccel: 4200, airAccel: 3200,
  gravity: 1900, maxFall: 560,
  jumpV: 640, jumpCut: 0.45, coyote: 0.08, jumpBuffer: 0.12,
  dashSpeed: 340, dashTime: 0.32,
  wallSlide: 95, wallStick: 0.14, wallGrace: 7,
  wallJumpVx: 200, wallJumpVy: 600, wallJumpLock: 0.13,
  atkSpeed: 1.0, hitstop: 1.0, crit: 0.15, btn: 1.0,
};
const DEFAULTS = Object.assign({}, T);
const TUNE = [
  ['runSpeed', 'Tốc độ chạy', 100, 260, 5],
  ['jumpV', 'Lực nhảy', 450, 820, 10],
  ['gravity', 'Trọng lực', 1200, 2800, 50],
  ['jumpCut', 'Nhả nút nhảy sớm (1 = không cắt)', 0.1, 1, 0.05],
  ['wallSlide', 'Tốc độ trượt tường', 30, 200, 5],
  ['wallJumpVx', 'Lực đạp tường ngang', 120, 340, 10],
  ['wallJumpLock', 'Thời gian khoá tay sau đạp tường', 0, 0.3, 0.01],
  ['dashSpeed', 'Tốc độ lướt', 220, 480, 10],
  ['atkSpeed', 'Tốc độ chém (x)', 0.6, 1.8, 0.05],
  ['hitstop', 'Khựng hình (x)', 0, 2.5, 0.1],
  ['btn', 'Cỡ nút (x)', 0.7, 1.5, 0.05],
];
try {
  const saved = JSON.parse(localStorage.getItem('ksbt-tune') || '{}');
  for (const k in saved) if (k in T && typeof saved[k] === 'number') T[k] = saved[k];
} catch (e) { /* trình duyệt chặn localStorage thì dùng mặc định */ }

// ============ Sprite ============
const S = 0.75;                       // tỉ lệ vẽ: khung 128px -> nhân vật cao ~49 đơn vị
const ANIMS = {
  Idle: { file: 'idle.png', n: 16 }, Run: { file: 'run.png', n: 18 }, Jump: { file: 'jump.png', n: 6 },
  Landing: { file: 'landing.png', n: 16 }, WallJump: { file: 'walljump.png', n: 20 }, Slide: { file: 'slide.png', n: 16 },
  AttackSwing1: { file: 'attackswing1.png', n: 21 }, AttackSwing2: { file: 'attackswing2.png', n: 15 },
  AttackSwing3: { file: 'attackswing3.png', n: 24 },
};
const IMG = {};

// Đòn chém. Số khung theo dải sprite; box = vùng vệt kiếm (px trong khung, gốc ở chân nhân vật).
const GROUND = [
  { anim: 'AttackSwing1', from: 7, fps: 38, hit: [12, 15], cancel: 14, end: 20, lunge: 70,
    box: [-28, 63, -93, -13], kb: [110, -90], dmg: [820, 1180], lines: 1, stop: 0.055, shake: 2.5 },
  { anim: 'AttackSwing2', from: 4, fps: 38, hit: [9, 12], cancel: 12, end: 14, lunge: 80,
    box: [-27, 63, -83, -3], kb: [90, -470], dmg: [900, 1300], lines: 2, stop: 0.065, shake: 3.5 },
  { anim: 'AttackSwing3', from: 7, fps: 34, hit: [14, 19], cancel: 21, end: 23, lunge: 120,
    box: [-53, 63, -99, 0], kb: [330, -210], dmg: [1500, 2100], lines: 3, stop: 0.12, shake: 7 },
];
const AIR = [
  { anim: 'AttackSwing1', from: 9, fps: 42, hit: [12, 15], cancel: 15, end: 19,
    box: [-28, 63, -93, -13], kb: [70, -300], dmg: [780, 1120], lines: 1, stop: 0.05, shake: 2 },
  { anim: 'AttackSwing2', from: 6, fps: 42, hit: [9, 12], cancel: 12, end: 14,
    box: [-27, 63, -83, -3], kb: [90, -320], dmg: [860, 1240], lines: 2, stop: 0.06, shake: 3 },
  { anim: 'AttackSwing3', from: 10, fps: 38, hit: [14, 19], cancel: 21, end: 23, spike: true,
    box: [-53, 63, -99, 0], kb: [200, 460], dmg: [1400, 2000], lines: 3, stop: 0.11, shake: 6 },
];

// ============ Đấu trường ============
const H = 360, FLOOR = 300, WALL = 26;
let AW = 640;
let solids = [], plats = [], mover = null;
function buildLevel() {
  solids = [
    { x: -100, y: -60, w: AW + 200, h: 60 },                         // trần
    { x: -100, y: FLOOR, w: AW + 200, h: 200 },                      // sàn
    { x: -100, y: -60, w: 100 + WALL, h: FLOOR + 160, wall: true },  // tường trái
    { x: AW - WALL, y: -60, w: WALL + 100, h: FLOOR + 160, wall: true }, // tường phải
  ];
  mover = { x: AW / 2 - 52, y: 162, w: 104, h: 10, cx: AW / 2 - 52, amp: AW * 0.16, t: 0, dx: 0, moving: true };
  plats = [
    { x: AW * 0.16, y: 228, w: AW * 0.2, h: 10 },
    { x: AW * 0.64, y: 228, w: AW * 0.2, h: 10 },
    { x: WALL, y: 108, w: 74, h: 10 },
    { x: AW - WALL - 74, y: 108, w: 74, h: 10 },
    mover,
  ];
}

// ============ Thực thể ============
const P = {
  x: 100, y: FLOOR, w: 18, h: 46, vx: 0, vy: 0, face: 1, onGround: true, ground: null,
  state: 'move', coyote: 0, lock: 0, dashT: 0, dashJump: false, wallSide: 0, stickT: 0, canCut: false,
  combo: 0, queued: false, airSwings: 0, hitSet: new Set(), comboWin: 0, nextCombo: 0, wjT: 0,
  oneShot: null, anim: null, trail: [], trailT: 0, prevVy: 0, wasGround: true,
};
function makeBag(hx) { return { kind: 'bag', x: hx, y: FLOOR, hx, w: 26, h: 40, vx: 0, vy: 0, onGround: true, ground: null, flash: 0, squash: 0, rot: 0, idle: 0, numY: 0, numT: 9 }; }
function makeFly(ax, ay) { return { kind: 'fly', x: ax, y: ay, ax, ay, vx: 0, vy: 0, flash: 0, squash: 0, t: 0, numY: 0, numT: 9 }; }
let targets = [];
function boxOf(t) {
  if (t.kind === 'bag') return [t.x - t.w / 2, t.x + t.w / 2, t.y - t.h, t.y];
  return [t.x - 15, t.x + 15, t.y - 15, t.y + 15];
}

const fx = [];       // bụi, tia lửa, vòng sáng
const nums = [];     // số sát thương
const combo = { hits: 0, t: 0, pop: 0 };
const stats = { wjChain: 0, wjBest: 0, full: 0, time: 0, started: false };
let hitstop = 0, shake = 0;

// ============ Tiện ích ============
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
function approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); }
function overlap(a, b) { return a[0] < b[1] && a[1] > b[0] && a[2] < b[3] && a[3] > b[2]; }

// ============ Va chạm (x = giữa, y = chân) ============
function moveBody(b, dt) {
  const prevL = b.x - b.w / 2, prevR = b.x + b.w / 2;
  b.x += b.vx * dt;
  b.hitWall = 0;
  for (const s of solids) {
    const L = b.x - b.w / 2, R = b.x + b.w / 2, top = b.y - b.h, bot = b.y;
    if (bot > s.y && top < s.y + s.h && R > s.x && L < s.x + s.w) {
      if (prevR <= s.x + 0.5) { b.x = s.x - b.w / 2; b.hitWall = 1; }
      else if (prevL >= s.x + s.w - 0.5) { b.x = s.x + s.w + b.w / 2; b.hitWall = -1; }
      if (b.hitWall) { b.wallVx = b.vx; b.vx = 0; }
    }
  }
  const prevBot = b.y;
  b.y += b.vy * dt;
  b.onGround = false; b.ground = null; b.landed = false;
  const L = b.x - b.w / 2, R = b.x + b.w / 2;
  for (const s of solids) {
    if (b.y > s.y && b.y - b.h < s.y + s.h && R > s.x && L < s.x + s.w) {
      if (b.vy >= 0 && prevBot <= s.y + 0.5) { b.impactVy = b.vy; b.y = s.y; b.vy = 0; b.onGround = true; b.ground = s; }
      else if (b.vy < 0) { b.y = s.y + s.h + b.h; b.vy = 0; }
    }
  }
  if (!b.onGround && b.vy >= 0) {
    for (const p of plats) {
      if (prevBot <= p.y + 0.5 && b.y >= p.y && R > p.x && L < p.x + p.w) { b.impactVy = b.vy; b.y = p.y; b.vy = 0; b.onGround = true; b.ground = p; break; }
    }
  }
}
function wallSideOf(b, dist) {
  const top = b.y - b.h + 4, bot = b.y - 4;
  for (const s of solids) {
    if (!s.wall || !(bot > s.y && top < s.y + s.h)) continue;
    const L = b.x - b.w / 2, R = b.x + b.w / 2;
    if (L >= s.x + s.w - 0.5 && L - (s.x + s.w) <= dist) return -1;
    if (R <= s.x + 0.5 && s.x - R <= dist) return 1;
  }
  return 0;
}

// ============ Nhập liệu ============
const kb = { left: false, right: false, jump: false, dash: false };
const tc = { left: false, right: false, jump: false, dash: false, attack: false };
const buf = { jump: 0, attack: 0, dash: 0 };
const inp = { left: false, right: false, jumpHeld: false, dashHeld: false };
function press(k) {
  if (!stats.started) stats.started = true;
  if (k === 'jump') buf.jump = T.jumpBuffer;
  else if (k === 'attack') buf.attack = 0.2;
  else if (k === 'dash') buf.dash = 0.1;
}
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', KeyZ: 'jump', KeyK: 'jump', ArrowUp: 'jump', KeyW: 'jump',
  KeyX: 'attack', KeyJ: 'attack', KeyC: 'dash', KeyL: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash',
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault();
  if (e.repeat) return;
  if (k === 'left' || k === 'right') { kb[k] = true; if (!stats.started) stats.started = true; }
  else { kb[k] = true; press(k); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) kb[k] = false; });
addEventListener('blur', () => { for (const k in kb) kb[k] = false; ptrs.clear(); });

// Nút cảm ứng: nửa trái màn hình = chạy (ngón cái trượt qua lại được), phải = Nhảy / Chém / Lướt
const ctrls = {};
const ptrs = new Map();
function classify(x, y) {
  if (x < cssW * 0.45) return x < (ctrls.left.x + ctrls.right.x) / 2 ? 'left' : 'right';
  let best = null, bd = 1e9;
  for (const k of ['attack', 'jump', 'dash']) {
    const c = ctrls[k]; const d = Math.hypot(x - c.x, y - c.y) / c.r;
    if (d < bd) { bd = d; best = k; }
  }
  return bd < 2.2 ? best : null;
}
const cv = document.getElementById('cv');
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const c = classify(e.clientX, e.clientY);
  ptrs.set(e.pointerId, c);
  if (c === 'jump' || c === 'attack' || c === 'dash') press(c);
  else if (c && !stats.started) stats.started = true;
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const old = ptrs.get(e.pointerId);
  const isMove = c => c === 'left' || c === 'right';
  let c;
  // ngón chạy chỉ đổi trái/phải; ngón nút chỉ lăn giữa các nút (không lẫn sang nhau)
  if (isMove(old)) c = e.clientX < (ctrls.left.x + ctrls.right.x) / 2 ? 'left' : 'right';
  else { c = classify(e.clientX, e.clientY); if (isMove(c)) c = null; }
  if (c !== old) { ptrs.set(e.pointerId, c); if (c === 'jump' || c === 'attack' || c === 'dash') press(c); }
});
const endPtr = e => ptrs.delete(e.pointerId);
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
function readInput() {
  tc.left = tc.right = tc.jump = tc.dash = tc.attack = false;
  for (const c of ptrs.values()) if (c) tc[c] = true;
  inp.left = kb.left || tc.left; inp.right = kb.right || tc.right;
  inp.jumpHeld = kb.jump || tc.jump; inp.dashHeld = kb.dash || tc.dash;
}

// ============ Hoạt ảnh ============
function setAnim(name, from, fps, loop, to, tag) {
  P.anim = { name, from, f: from, fps, loop: !!loop, to: to === undefined ? ANIMS[name].n - 1 : to, done: false, tag: tag || '' };
}
function stepAnim(a, dt) {
  if (a.done || !a.fps) return;
  a.f += a.fps * dt;
  if (a.f >= a.to + 1) {
    if (a.loop) a.f = a.from + ((a.f - a.from) % (a.to + 1 - a.from));
    else { a.f = a.to + 0.999; a.done = true; }
  }
}

// ============ Người chơi ============
function doJump() {
  P.vy = -T.jumpV; P.onGround = false; P.coyote = 0; buf.jump = 0; P.canCut = true; P.ground = null;
  if (P.state === 'dash' || inp.dashHeld) P.dashJump = true;
  P.state = 'move'; P.h = 46; P.oneShot = null;
  setAnim('Jump', 3, 18, false, 5);
  dust(P.x, P.y, 5, 0);
}
function doWallJump(side) {
  buf.jump = 0;
  P.dashJump = inp.dashHeld;
  P.vx = -side * (P.dashJump ? T.dashSpeed : T.wallJumpVx);
  P.vy = -T.wallJumpVy; P.lock = T.wallJumpLock; P.face = -side; P.canCut = true;
  P.state = 'move'; P.wjT = 0.3; P.airSwings = 0;
  setAnim('WallJump', 2, 32, false, 14);
  stats.wjChain++; stats.wjBest = Math.max(stats.wjBest, stats.wjChain);
  dust(P.x + side * 9, P.y - 20, 6, -side);
}
function enterWall(side) {
  P.state = 'wall'; P.wallSide = side; P.face = -side; P.stickT = T.wallStick; P.dashJump = false; P.airSwings = 0;
  setAnim('WallJump', 0, 0, false, 0);
}
function startDash(dir) {
  buf.dash = 0;
  P.state = 'dash'; P.dashT = T.dashTime; if (dir) P.face = dir; P.h = 26; P.oneShot = null;
  setAnim('Slide', 1, 24, false, 8);
  dust(P.x - P.face * 8, P.y, 6, -P.face);
}
function startAttack(i, dir) {
  buf.attack = 0;
  P.state = 'attack'; P.combo = i; P.queued = false; P.hitSet.clear(); P.h = 46; P.oneShot = null;
  if (dir) P.face = dir;
  const c = GROUND[i];
  setAnim(c.anim, c.from, c.fps * T.atkSpeed, false, c.end);
  if (i === 2) stats.full++;
}
function startAirAttack(dir) {
  buf.attack = 0;
  if (P.airSwings >= AIR.length) return false;
  const i = P.airSwings++;
  P.state = 'aatk'; P.combo = i; P.queued = false; P.hitSet.clear(); P.h = 46; P.lock = 0;
  if (dir) P.face = dir;
  const c = AIR[i];
  setAnim(c.anim, c.from, c.fps * T.atkSpeed, false, c.end);
  if (!c.spike) P.vy = Math.min(P.vy, 40);
  if (i === 2) stats.full++;
  return true;
}
function gravityStep(dt, mul) { P.vy = Math.min(P.vy + T.gravity * (mul || 1) * dt, T.maxFall); }

function moveState(dt, dir) {
  if (P.lock <= 0) {
    const maxV = P.dashJump && !P.onGround ? T.dashSpeed * 0.92 : T.runSpeed;
    P.vx = approach(P.vx, dir * maxV, (P.onGround ? T.groundAccel : T.airAccel) * dt);
    if (dir) P.face = dir;
  }
  gravityStep(dt);
  if (!inp.jumpHeld && P.vy < 0 && P.canCut) { P.vy *= T.jumpCut; P.canCut = false; }
  if (buf.attack > 0) {
    if (P.onGround) { startAttack(P.comboWin > 0 ? P.nextCombo : 0, dir); return; }
    if (startAirAttack(dir)) return;
  }
  if (buf.dash > 0 && P.onGround) { startDash(dir); return; }
  if (buf.jump > 0) {
    if (P.onGround || P.coyote > 0) doJump();
    else { const ws = wallSideOf(P, T.wallGrace); if (ws) doWallJump(ws); }
  }
  if (!P.onGround && P.vy > 0 && P.lock <= 0) {
    const ws = wallSideOf(P, 1.5);
    if (ws && dir === ws) enterWall(ws);
  }
}
function wallState(dt, dir) {
  P.vx = P.wallSide * 20;
  P.vy = approach(P.vy, T.wallSlide, 3000 * dt);
  if (dir === P.wallSide) P.stickT = T.wallStick; else P.stickT -= dt;
  if (buf.jump > 0) { doWallJump(P.wallSide); return; }
  if (buf.attack > 0) { P.state = 'move'; P.face = -P.wallSide; P.vx = 0; startAirAttack(0); return; }
  if (P.stickT <= 0) { P.state = 'move'; P.vx = -P.wallSide * 30; }
  if (Math.random() < dt * 14) dust(P.x + P.wallSide * 9, P.y - 30, 1, -P.wallSide, 0.5);
}
function dashState(dt, dir) {
  P.vx = P.face * T.dashSpeed;
  gravityStep(dt);
  P.dashT -= dt;
  if (buf.jump > 0 && (P.onGround || P.coyote > 0)) { P.dashJump = true; doJump(); return; }
  if (buf.attack > 0) { P.h = 46; startAttack(0, dir); P.vx = P.face * T.dashSpeed * 0.5; return; }
  if (!P.onGround) { P.state = 'move'; P.dashJump = true; P.h = 46; return; }

function drawNumbers() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  for (const n of nums) {
    if (n.t < 0) continue;
    const pop = n.t < 0.08 ? 1.6 - (n.t / 0.08) * 0.6 : 1;
    const rise = (1 - Math.pow(1 - Math.min(1, n.t / n.life), 3)) * 22;
    const a = n.t > n.life - 0.3 ? (n.life - n.t) / 0.3 : 1;
    const size = (n.crit ? 21 : 16) * pop;
    ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(n.x, n.y - rise);
    ctx.font = `italic 900 ${size}px "Arial Black", system-ui, sans-serif`;
    const gr = ctx.createLinearGradient(0, -size, 0, 0);
    if (n.crit) { gr.addColorStop(0, '#fff0f6'); gr.addColorStop(0.45, '#ff8fb2'); gr.addColorStop(1, '#ff1f5a'); }
    else { gr.addColorStop(0, '#fff6c9'); gr.addColorStop(0.45, '#ffc14d'); gr.addColorStop(1, '#ff7a1a'); }
    ctx.lineWidth = 4; ctx.strokeStyle = n.crit ? '#3d0717' : '#3a1606'; ctx.strokeText(n.txt, 0, 0);
    ctx.fillStyle = gr; ctx.fillText(n.txt, 0, 0);
    if (n.crit) {
      ctx.font = `italic 900 ${11 * pop}px "Arial Black", system-ui, sans-serif`;
      ctx.lineWidth = 3; ctx.strokeStyle = '#3d0717'; ctx.strokeText('CRIT', -size * 1.5, -size * 0.55);
      ctx.fillStyle = '#ffe45c'; ctx.fillText('CRIT', -size * 1.5, -size * 0.55);
    }
    ctx.restore();
  }
}
function drawFx() {
  for (const p of fx) {
    const a = p.life / p.max;
    if (p.type === 'dust') { ctx.globalAlpha = a * 0.6; ctx.fillStyle = '#c8cee0'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.4 - a * 0.4), 0, 6.29); ctx.fill(); }
    else if (p.type === 'spark') {
      ctx.globalAlpha = Math.min(1, a * 1.5); ctx.strokeStyle = '#ffe7b0'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); ctx.stroke();
    } else if (p.type === 'ring') {
      ctx.globalAlpha = a; ctx.strokeStyle = p.crit ? '#ff6b94' : '#ffffff'; ctx.lineWidth = 3 * a + 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.stroke();
    } else if (p.type === 'slash') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
      const l = p.len * (1.2 - a * 0.2);
      ctx.globalAlpha = a; ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(-l / 2, 0); ctx.quadraticCurveTo(0, -4 * a - 1, l / 2, 0); ctx.quadraticCurveTo(0, 4 * a + 1, -l / 2, 0); ctx.fill();
      ctx.globalAlpha = a * 0.5; ctx.fillStyle = '#ff5a3c';
      ctx.beginPath(); ctx.moveTo(-l / 2.4, 0); ctx.quadraticCurveTo(0, -9 * a, l / 2.4, 0); ctx.quadraticCurveTo(0, 9 * a, -l / 2.4, 0); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function drawControls() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const k of ['left', 'right', 'jump', 'attack', 'dash']) {
    const c = ctrls[k], on = tc[k];
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.29);
    ctx.fillStyle = on ? 'rgba(255,179,92,.5)' : k === 'attack' ? 'rgba(230,70,70,.22)' : 'rgba(255,255,255,.1)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = on ? 'rgba(255,214,160,.9)' : 'rgba(255,255,255,.32)'; ctx.stroke();
    ctx.fillStyle = on ? '#fff' : 'rgba(255,255,255,.8)';
    ctx.font = `600 ${k === 'left' || k === 'right' ? c.r * 0.6 : c.r * 0.36}px system-ui, sans-serif`;
    ctx.fillText(c.label, c.x, c.y + 1);
  }
}
function drawHud() {
  // bộ đếm combo
  if (combo.hits >= 2) {
    const a = Math.min(1, combo.t / 0.5), x = cssW - 18 - safeR, y = 78;
    const mult = combo.hits >= 25 ? 3 : combo.hits >= 10 ? 2 : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    const sz = 34 * (1 + combo.pop * 0.35);
    ctx.font = `italic 900 ${sz}px "Arial Black", system-ui, sans-serif`;
    ctx.lineWidth = 5; ctx.strokeStyle = '#3a1606'; ctx.strokeText(combo.hits, x - 44, y);
    ctx.fillStyle = '#fff1d6'; ctx.fillText(combo.hits, x - 44, y);
    ctx.font = 'italic 900 15px "Arial Black", system-ui, sans-serif';
    ctx.lineWidth = 4; ctx.strokeText('HIT', x, y - 2); ctx.fillStyle = '#ffb35c'; ctx.fillText('HIT', x, y - 2);
    if (mult > 1) {
      ctx.font = 'italic 900 16px "Arial Black", system-ui, sans-serif';
      ctx.strokeText('ĐIỂM x' + mult, x, y + 20); ctx.fillStyle = '#ffe45c'; ctx.fillText('ĐIỂM x' + mult, x, y + 20);
    }
    ctx.restore();
  }
  // số đo cho giả thuyết: một dòng nhỏ giữa mép trên, không che đấu trường
  const m = Math.floor(stats.time / 60), s = Math.floor(stats.time % 60);
  const okW = stats.wjBest >= 3, okC = stats.full >= 5;
  const parts = [
    [`Đạp tường ${stats.wjChain} (cao nhất ${stats.wjBest}/3${okW ? ' ✓' : ''})`, okW ? '#8ef0a8' : '#e9edf5'],
    [`Combo 3 nhát ${stats.full}/5${okC ? ' ✓' : ''}`, okC ? '#8ef0a8' : '#e9edf5'],
    [stats.started ? `${m}:${String(s).padStart(2, '0')}` : 'bấm nút bất kỳ để bắt đầu', stats.time > 120 ? '#ffb35c' : '#9aa6bd'],
  ];
  ctx.font = '600 11px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const gap = 14, widths = parts.map(p => ctx.measureText(p[0]).width);
  const tw = widths.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
  let x = (cssW - tw) / 2;
  ctx.fillStyle = 'rgba(8,11,20,.5)'; rr(ctx, x - 10, 6, tw + 20, 20, 10); ctx.fill();
  parts.forEach((p, i) => { ctx.fillStyle = p[1]; ctx.fillText(p[0], x, 16.5); x += widths[i] + gap; });
}
let safeL = 0, safeR = 0;
function render() {
  const k = scale * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b0f18'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = shake ? rnd(-1, 1) * shake : 0, sy = shake ? rnd(-1, 1) * shake : 0;
  const ox = (offX + sx * scale) * dpr, oy = (offY + sy * scale) * dpr;
  ctx.drawImage(bg, Math.round(ox), Math.round(oy));
  ctx.setTransform(k, 0, 0, k, ox, oy);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  drawPlat(ctx, mover);
  const time = performance.now() / 1000;
  for (const t of targets) t.kind === 'bag' ? drawBag(t) : drawFly(t, time);
  for (const g of P.trail) drawSprite(g.name, g.f, g.x, g.y, g.face, (g.life / 0.2) * 0.35);
  const wallPose = P.state === 'wall';
  drawSprite(P.anim.name, P.anim.f, P.x, P.y, P.face, 1, wallPose ? 13 : 0);
  drawFx();
  drawNumbers();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawControls();
  drawHud();
}

// ============ Bảng chỉnh thông số ============
const tuneEl = document.getElementById('tune');
function buildTune() {
  tuneEl.innerHTML = '';
  for (const [key, label, min, max, st] of TUNE) {
    const l = document.createElement('label');
    l.innerHTML = `${label} <b></b>`;
    const r = document.createElement('input');
    r.type = 'range'; r.min = min; r.max = max; r.step = st; r.value = T[key];
    const show = () => { l.querySelector('b').textContent = (+T[key]).toFixed(st < 1 ? 2 : 0); };
    r.addEventListener('input', () => { T[key] = +r.value; show(); if (key === 'btn') layoutControls(); save(); });
    show(); tuneEl.append(l, r);
  }
  const row = document.createElement('div'); row.className = 'row';
  const reset = document.createElement('button'); reset.textContent = 'Mặc định';
  reset.onclick = () => { Object.assign(T, DEFAULTS); save(); buildTune(); layoutControls(); };
  const close = document.createElement('button'); close.textContent = 'Đóng';
  close.onclick = () => { tuneEl.hidden = true; };
  row.append(reset, close); tuneEl.append(row);
}
function save() { try { localStorage.setItem('ksbt-tune', JSON.stringify(T)); } catch (e) {} }
document.getElementById('tuneBtn').onclick = () => { tuneEl.hidden = !tuneEl.hidden; if (!tuneEl.hidden) buildTune(); };
document.getElementById('fsBtn').onclick = () => {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (!req) return;
  try {
    const p = req.call(el);
    if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  } catch (e) {}
};

// ============ Khởi động ============
addEventListener('resize', () => { resize(); safeL = safeInset('--sal'); safeR = safeInset('--sar'); });
function boot() {
  resize(); safeL = safeInset('--sal'); safeR = safeInset('--sar');
  P.x = AW * 0.15; P.y = FLOOR;
  setAnim('Idle', 0, 12, true);
  document.getElementById('loading').remove();
  window.__dbg = { P, T, stats, targets, combo };
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
let pending = 0;
for (const name in ANIMS) {
  pending++;
  const img = new Image();
  img.onload = () => { IMG[name] = img; if (--pending === 0) boot(); };
  img.onerror = () => { document.getElementById('loading').textContent = 'Không tải được sprites/' + ANIMS[name].file; };
  img.src = 'sprites/' + ANIMS[name].file;
}
</script>
