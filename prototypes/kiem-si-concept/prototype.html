<script>
// PROTOTYPE - NOT FOR PRODUCTION
// Question: Chạy, đạp tường, nhảy đôi, combo + 10 màn quái/boss + kỹ năng kiểu MOBA trên điện thoại có "đã tay" không?
// Date: 2026-11-03
'use strict';

// ============ Thông số chỉnh được (giá trị cứng, chỉnh bằng nút ⚙) ============
const T = {
  runSpeed: 165, groundAccel: 4200, airAccel: 3200,
  gravity: 1900, maxFall: 560,
  jumpV: 640, jumpCut: 0.45, coyote: 0.08, jumpBuffer: 0.12, djump: 0.86,
  dashSpeed: 340, dashTime: 0.32,
  wallSlide: 95, wallStick: 0.14, wallGrace: 7,
  wallJumpVx: 200, wallJumpVy: 600, wallJumpLock: 0.13,
  atkSpeed: 1.0, hitstop: 1.0, crit: 0.15, btn: 1.0, monSpeed: 1.0, monDmg: 1.0, skillCd: 1.0,
};
const DEFAULTS = Object.assign({}, T);
const TUNE = [
  ['runSpeed', 'Tốc độ chạy', 100, 260, 5],
  ['jumpV', 'Lực nhảy', 450, 820, 10],
  ['djump', 'Lực nhảy đôi (x)', 0.5, 1.2, 0.02],
  ['gravity', 'Trọng lực', 1200, 2800, 50],
  ['jumpCut', 'Nhả nút nhảy sớm (1 = không cắt)', 0.1, 1, 0.05],
  ['wallSlide', 'Tốc độ trượt tường', 30, 200, 5],
  ['wallJumpVx', 'Lực đạp tường ngang', 120, 340, 10],
  ['dashSpeed', 'Tốc độ lướt', 220, 480, 10],
  ['atkSpeed', 'Tốc độ chém (x)', 0.6, 1.8, 0.05],
  ['hitstop', 'Khựng hình (x)', 0, 2.5, 0.1],
  ['skillCd', 'Thời gian hồi chiêu (x)', 0.2, 2, 0.05],
  ['monSpeed', 'Tốc độ quái (x)', 0.5, 2, 0.05],
  ['monDmg', 'Sát thương quái (x)', 0, 3, 0.1],
  ['btn', 'Cỡ nút (x)', 0.7, 1.5, 0.05],
];
try {
  const saved = JSON.parse(localStorage.getItem('ksbt-tune') || '{}');
  for (const k in saved) if (k in T && typeof saved[k] === 'number') T[k] = saved[k];
} catch (e) { /* trình duyệt chặn localStorage thì dùng mặc định */ }

// ============ Sprite ============
const S = 0.75;                       // tỉ lệ vẽ: khung 128px -> nhân vật cao ~49 đơn vị
const ANIMS = {
  Idle: { file: 'idle.png', n: 16 }, Run: { file: 'run.png', n: 18 }, Jump: { file: 'jump.png', n: 6 },
  Landing: { file: 'landing.png', n: 16 }, WallJump: { file: 'walljump.png', n: 20 }, Slide: { file: 'slide.png', n: 16 },
  AttackSwing1: { file: 'attackswing1.png', n: 21 }, AttackSwing2: { file: 'attackswing2.png', n: 15 },
  AttackSwing3: { file: 'attackswing3.png', n: 24 }, Death: { file: 'death.png', n: 39 },
};
const IMG = {};

// ============ Kiếm nguyên tố: tách lưỡi kiếm khỏi da tay/mặt rồi tô màu theo kỹ năng ============
// Lưỡi kiếm và da đều trắng; lưỡi kiếm mảnh (bị bào mất khi co 3x3), da là mảng dày (còn lại).
// Mảng dày rất lớn là vệt chém trong khung tấn công nên vẫn tính là "kiếm".
const PAL = {
  fire: { lo: [214, 38, 8], mid: [255, 140, 26], hi: [255, 240, 170], glow: [255, 96, 20], glowMul: 2.6 },
  bolt: { lo: [24, 84, 235], mid: [70, 175, 255], hi: [232, 252, 255], glow: [70, 170, 255], glowMul: 2.4 },
  wave: { lo: [20, 150, 130], mid: [60, 215, 185], hi: [230, 255, 248], glow: [60, 220, 190], glowMul: 1.5 },
};
let bladeData = null;      // tên anim -> { W, H, src, blade, pts[frame] }
const VAR = {};            // nguyên tố -> tên anim -> { tint, glow }
function analyzeBlades() {
  const data = {};
  for (const name in ANIMS) {
    const img = IMG[name], n = ANIMS[name].n, W = img.width, H = img.height, N = W * H;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const src = g.getImageData(0, 0, W, H).data;   // ném lỗi nếu canvas bị "bẩn" (mở file:// với ảnh rời)
    const white = new Uint8Array(N), core = new Uint8Array(N);
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const r = src[p], gg = src[p + 1], b = src[p + 2];
      const mn = Math.min(r, gg, b), mx = Math.max(r, gg, b);
      if (src[p + 3] > 60 && mn > 140 && mx - mn < 40) white[i] = 1;
    }
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const fx0 = x % 128; if (fx0 === 0 || fx0 === 127) continue;
      const i = y * W + x;
      if (white[i] && white[i - 1] && white[i + 1] && white[i - W] && white[i + W] &&
          white[i - W - 1] && white[i - W + 1] && white[i + W - 1] && white[i + W + 1]) core[i] = 1;
    }
    const label = new Int32Array(N), areas = [0], stack = [];
    let L = 0;
    for (let i = 0; i < N; i++) {
      if (!core[i] || label[i]) continue;
      L++; let area = 0; label[i] = L; stack.push(i);
      while (stack.length) {
        const j = stack.pop(), x = j % W; area++;
        if (x % 128 !== 0 && core[j - 1] && !label[j - 1]) { label[j - 1] = L; stack.push(j - 1); }
        if (x % 128 !== 127 && core[j + 1] && !label[j + 1]) { label[j + 1] = L; stack.push(j + 1); }
        if (j >= W && core[j - W] && !label[j - W]) { label[j - W] = L; stack.push(j - W); }
        if (j + W < N && core[j + W] && !label[j + W]) { label[j + W] = L; stack.push(j + W); }
      }
      areas.push(area);
    }
    const skin = new Uint8Array(N);
    for (let i = 0; i < N; i++) {
      if (!label[i] || areas[label[i]] >= 150) continue;
      const x = i % W, y = (i / W) | 0;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < W && yy >= 0 && yy < H && ((xx / 128) | 0) === ((x / 128) | 0)) skin[yy * W + xx] = 1;
      }
    }
    const blade = new Uint8Array(N);
    for (let i = 0; i < N; i++) if (white[i] && !skin[i]) blade[i] = 1;
    const pts = [];
    for (let f = 0; f < n; f++) {
      const list = [];
      for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) if (blade[y * W + f * 128 + x]) list.push(x, y);
      const cnt = list.length / 2, keep = Math.min(cnt, 90), out = new Int16Array(keep * 2);
      for (let k = 0; k < keep; k++) { const j = Math.floor((k + Math.random()) * cnt / keep); out[k * 2] = list[j * 2]; out[k * 2 + 1] = list[j * 2 + 1]; }
      pts.push(out);
    }
    data[name] = { W, H, src, blade, pts };
  }
  return data;
}
// làm mờ hộp; chiều ngang tính riêng từng khung 128px để quầng sáng không lem sang khung bên cạnh
function boxBlur(a, W, H, r) {
  const tmp = new Float32Array(W * H), out = new Float32Array(W * H), k = 1 / (2 * r + 1);
  for (let y = 0; y < H; y++) for (let f0 = 0; f0 < W; f0 += 128) {
    const o = y * W + f0, fw = Math.min(128, W - f0); let s = 0;
    for (let x = -r; x <= r; x++) s += a[o + clamp(x, 0, fw - 1)];
    for (let x = 0; x < fw; x++) { tmp[o + x] = s * k; s += a[o + Math.min(fw - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; }
  }
  for (let x = 0; x < W; x++) {
    let s = 0;
    for (let y = -r; y <= r; y++) s += tmp[clamp(y, 0, H - 1) * W + x];
    for (let y = 0; y < H; y++) { out[y * W + x] = s * k; s += tmp[Math.min(H - 1, y + r + 1) * W + x] - tmp[Math.max(0, y - r) * W + x]; }
  }
  return out;
}
function buildVariant(elem) {
  if (VAR[elem] || !bladeData || !PAL[elem]) return VAR[elem];
  const pal = PAL[elem], out = {};
  for (const name in bladeData) {
    const { W, H, src, blade } = bladeData[name], N = W * H;
    const tint = document.createElement('canvas'); tint.width = W; tint.height = H;
    const tg = tint.getContext('2d'), td = tg.createImageData(W, H), d = td.data;
    d.set(src);
    const alpha = new Float32Array(N);
    for (let i = 0, p = 0; i < N; i++, p += 4) if (blade[i]) alpha[i] = src[p + 3] / 255;
    const bl = boxBlur(boxBlur(alpha, W, H, 3), W, H, 3);
    // lưỡi mảnh: tô theo độ sáng; vệt chém dày: lõi sáng, viền đậm màu (lửa cam đỏ / điện xanh)
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      if (!blade[i]) continue;
      const l = (src[p] + src[p + 1] + src[p + 2]) / 765;
      const t = bl[i] < 0.38 ? Math.pow(clamp((l - 0.55) / 0.45, 0, 1), 1.5) : Math.pow(clamp((bl[i] - 0.45) / 0.5, 0, 1), 1.3) * clamp((l - 0.4) / 0.5, 0, 1);
      const c = t < 0.5 ? [pal.lo, pal.mid, t * 2] : [pal.mid, pal.hi, t * 2 - 1];
      d[p] = c[0][0] + (c[1][0] - c[0][0]) * c[2];
      d[p + 1] = c[0][1] + (c[1][1] - c[0][1]) * c[2];
      d[p + 2] = c[0][2] + (c[1][2] - c[0][2]) * c[2];
    }
    tg.putImageData(td, 0, 0);
    const glow = document.createElement('canvas'); glow.width = W; glow.height = H;
    const gg = glow.getContext('2d'), gd = gg.createImageData(W, H), e = gd.data;
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const a = Math.min(1, bl[i] * pal.glowMul);
      if (a <= 0.01) continue;
      e[p] = pal.glow[0]; e[p + 1] = pal.glow[1]; e[p + 2] = pal.glow[2]; e[p + 3] = a * 255;
    }
    gg.putImageData(gd, 0, 0);
    out[name] = { tint, glow };
  }
  VAR[elem] = out;
  return out;
}
function bladeWorld(px, py, ox) { return [P.x + P.face * (px - 64 + ox) * S, P.y + (py - 100) * S]; }
function bladePts() {
  if (!bladeData || !P.anim) return null;
  const name = P.anim.name, fi = clamp(Math.floor(P.anim.f), 0, ANIMS[name].n - 1);
  const pts = bladeData[name].pts[fi];
  return pts && pts.length ? pts : null;
}
function isAttacking() { return P.state === 'attack' || P.state === 'aatk' || P.state === 'whirl'; }
// lửa toé ra từ lưỡi kiếm (cập nhật theo thời gian thực)
function swordFx(dt) {
  if (G.mode !== 'play' || P.dead || !G.elem || !VAR[G.elem]) return;
  const pts = bladePts(); if (!pts) return;
  const n = pts.length / 2, ox = P.state === 'wall' ? 13 : 0, attacking = isAttacking();
  if (G.elem === 'fire') {
    let k = (attacking ? 220 : 120) * dt; k = Math.floor(k) + (Math.random() < k % 1 ? 1 : 0);
    for (let i = 0; i < k; i++) {
      const j = Math.floor(Math.random() * n), [x, y] = bladeWorld(pts[j * 2], pts[j * 2 + 1], ox);
      const ember = Math.random() < 0.25;
      fx.push(ember
        ? { type: 'fire', x, y, vx: rnd(-30, 30) - P.vx * 0.15, vy: rnd(-170, -80), r: rnd(0.8, 1.6), life: rnd(0.3, 0.55), max: 0.55 }
        : { type: 'fire', x: x + rnd(-1.5, 1.5), y, vx: rnd(-12, 12) - P.vx * 0.3, vy: rnd(-80, -35), r: rnd(1.8, attacking ? 4 : 3.2), life: rnd(0.12, 0.26), max: 0.3 });
    }
  } else if (G.elem === 'bolt') {
    if (Math.random() < (attacking ? 30 : 9) * dt) {
      const j = Math.floor(Math.random() * n), [x, y] = bladeWorld(pts[j * 2], pts[j * 2 + 1], ox), a = rnd(0, 6.28);
      fx.push({ type: 'spark', x, y, vx: Math.cos(a) * 180, vy: Math.sin(a) * 180, life: 0.12, max: 0.3, blue: true });
    }
  }
}
function jagged(x0, y0, x1, y1, segs, amp) {
  const nx = -(y1 - y0), ny = x1 - x0, l = Math.hypot(nx, ny) || 1;
  ctx.moveTo(x0, y0);
  for (let i = 1; i < segs; i++) {
    const t = i / segs, o = (Math.random() - 0.5) * amp * 2;
    ctx.lineTo(x0 + (x1 - x0) * t + nx / l * o, y0 + (y1 - y0) * t + ny / l * o);
  }
  ctx.lineTo(x1, y1);
}
// tia điện chạy quanh lưỡi kiếm (vẽ mới mỗi khung hình nên tự chập chờn)
function drawBladeArcs() {
  if (G.elem !== 'bolt' || !VAR.bolt || P.dead) return;
  const pts = bladePts(); if (!pts) return;
  const n = pts.length / 2, ox = P.state === 'wall' ? 13 : 0, attacking = isAttacking();
  const arcs = [];
  for (let k = 0; k < (attacking ? 6 : 3); k++) {
    if (Math.random() < 0.3) continue;
    const i = Math.floor(Math.random() * n), [ax, ay] = bladeWorld(pts[i * 2], pts[i * 2 + 1], ox);
    let bx, by;
    if (Math.random() < 0.55 && n > 1) {
      const j = Math.floor(Math.random() * n); [bx, by] = bladeWorld(pts[j * 2], pts[j * 2 + 1], ox);
      const d = Math.hypot(bx - ax, by - ay);
      if (d > 26 || d < 4) { const a = rnd(0, 6.28); bx = ax + Math.cos(a) * 12; by = ay + Math.sin(a) * 12; }
    } else { const a = rnd(0, 6.28), len = rnd(6, attacking ? 20 : 13); bx = ax + Math.cos(a) * len; by = ay + Math.sin(a) * len; }
    arcs.push([ax, ay, bx, by]);
  }
  if (!arcs.length) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const [ax, ay, bx, by] of arcs) {
    ctx.beginPath(); jagged(ax, ay, bx, by, 4, 3.5);
    ctx.globalAlpha = 0.45; ctx.strokeStyle = '#3f8dff'; ctx.lineWidth = 2.6; ctx.stroke();
    ctx.globalAlpha = 0.95; ctx.strokeStyle = '#eafcff'; ctx.lineWidth = 0.9; ctx.stroke();
  }
  ctx.restore();
}

// Đòn chém. Số khung theo dải sprite; box = vùng vệt kiếm (px trong khung, gốc ở chân nhân vật).
// lines = số dòng sát thương bật lên mỗi lần trúng (kiểu MapleStory M).
const GROUND = [
  { anim: 'AttackSwing1', from: 7, fps: 38, hit: [12, 15], cancel: 14, end: 20, lunge: 70,
    box: [-28, 63, -93, -13], kb: [110, -90], dmg: [820, 1180], lines: 2, stop: 0.055, shake: 2.5, stun: 0.35 },
  { anim: 'AttackSwing2', from: 4, fps: 38, hit: [9, 12], cancel: 12, end: 14, lunge: 80,

  for (const at of list) {

function moveBody(b, dt, isPlayer) {
  const prevL = b.x - b.w / 2, prevR = b.x + b.w / 2;
  b.x += b.vx * dt;
  b.hitWall = 0;
  for (const s of solids) {
    if (s.playerOnly && !isPlayer) continue;
    const L = b.x - b.w / 2, R = b.x + b.w / 2, top = b.y - b.h, bot = b.y;
    if (bot > s.y && top < s.y + s.h && R > s.x && L < s.x + s.w) {
      if (prevR <= s.x + 0.5) { b.x = s.x - b.w / 2; b.hitWall = 1; }
      else if (prevL >= s.x + s.w - 0.5) { b.x = s.x + s.w + b.w / 2; b.hitWall = -1; }
      if (b.hitWall) { b.wallVx = b.vx; b.vx = 0; }
    }
  }
  const prevBot = b.y;
  b.y += b.vy * dt;
  b.onGround = false; b.ground = null;
  const L = b.x - b.w / 2, R = b.x + b.w / 2;
  for (const s of solids) {
    if (s.playerOnly && !isPlayer) continue;
    if (b.y > s.y && b.y - b.h < s.y + s.h && R > s.x && L < s.x + s.w) {
      if (b.vy >= 0 && prevBot <= s.y + 0.5) { b.impactVy = b.vy; b.y = s.y; b.vy = 0; b.onGround = true; b.ground = s; }
      else if (b.vy < 0) { b.y = s.y + s.h + b.h; b.vy = 0; }
    }
  }
  if (!b.onGround && b.vy >= 0 && !(b.dropT > 0)) {
    for (const p of plats) {
      if (prevBot <= p.y + 0.5 && b.y >= p.y && R > p.x && L < p.x + p.w) { b.impactVy = b.vy; b.y = p.y; b.vy = 0; b.onGround = true; b.ground = p; break; }
    }
  }
}

  const top = b.y - b.h + 4, bot = b.y - 4;
  for (const s of solids) {
    if (!s.wall || !(bot > s.y && top < s.y + s.h)) continue;
    const L = b.x - b.w / 2, R = b.x + b.w / 2;
    if (L >= s.x + s.w - 0.5 && L - (s.x + s.w) <= dist) return -1;
    if (R <= s.x + 0.5 && s.x - R <= dist) return 1;

  }
}

// cú đáp đất / phun trào: nổ lớn, cột lửa, mảnh vỡ, nổ dây chuyền khắp đấu trường

function updateBoss(dt) {

// ============ Boss 2: Hỏa Long ============
// Rồng dài nhiều đốt bay lượn; sàn định kỳ hóa dung nham, máu rồng càng thấp thì dung nham càng hay trào.
function spawnDragon() {
  boss = { kind: 'dragon', x: AW / 2, y: FLOOR + 70, hp: MON.dragonHp, maxHp: MON.dragonHp, state: 'rumble', st: 0, segs: [],
    flash: 0, squash: 0, burn: null, stun: 0, dead: false, numT: 9, mode: '', mt: 0, path: null, aim: 0, ang: -Math.PI / 2, charge: 0, last: '', boomT: 0, fireT: 0 };

}
function dragonMouth(b) { return [b.x + Math.cos(b.ang) * 26, b.y + Math.sin(b.ang) * 26]; }
function dragonNext(b, ratio) {
  const opts = ['swoop', 'breath', 'balls', 'swoop'].filter(m => m !== b.last);
  b.mode = b.x < -20 || b.x > AW + 20 ? 'swoop' : opts[Math.floor(Math.random() * opts.length)];
  b.last = b.mode; b.mt = 0; b.charge = 0;
  if (b.mode === 'swoop') {
    const toRight = b.x < AW / 2;
    b.path = { x0: b.x, y0: b.y, x1: toRight ? AW + 100 : -100, dur: lerp(1.9, 2.9, ratio) };
  } else if (b.mode === 'breath') {
    const s = P.x < AW / 2 ? 1 : -1;
    b.path = { tx: s > 0 ? AW - WALL - 70 : WALL + 70, ty: 72 };
    b.aim = Math.atan2(P.y - 30 - 72, P.x - b.path.tx);
  } else {
    b.path = { tx: clamp(P.x + rnd(-80, 80), WALL + 80, AW - WALL - 80), ty: 66 }; b.balls = 0;
  }
}
function updateDragon(dt) {
  const b = boss; b.st += dt;
  const ratio = Math.max(0, b.hp / b.maxHp);
  let targetAng = null;
  switch (b.state) {
    case 'rumble':   // sàn rung, nứt lửa
      shake = Math.max(shake, 3);
      if (Math.random() < dt * 30) fx.push({ type: 'fire', x: AW / 2 + rnd(-50, 50), y: FLOOR, vx: rnd(-20, 20), vy: rnd(-160, -60), r: rnd(3, 6), life: 0.4, max: 0.4 });
      if (b.st > 0.9) { b.state = 'burst'; b.st = 0; bigImpact(AW / 2); }
      break;
    case 'burst':    // phóng vọt lên khỏi sàn
      b.y -= 560 * dt; targetAng = -Math.PI / 2;
      for (let i = 0; i < 2; i++) fx.push({ type: 'fire', x: b.x + rnd(-14, 14), y: Math.min(FLOOR, b.y + 30), vx: rnd(-40, 40), vy: rnd(-80, 60), r: rnd(4, 8), life: 0.4, max: 0.4 });
      if (b.y <= 115) { b.state = 'roar'; b.st = 0; shake = Math.max(shake, 8); }
      break;
    case 'roar':

      b.x += Math.sin(b.st * 9) * 30 * dt; b.y += Math.cos(b.st * 7) * 20 * dt; targetAng = Math.PI * 0.5 + Math.sin(b.st * 3) * 0.6;
      b.charge = Math.min(1, b.st);
      if (b.st > 1.6) { b.state = 'fight'; b.st = 0; G.phase = 'boss'; G.bossBar = 1; G.lava = { state: 'off', t: 2.5 }; dragonNext(b, ratio); }
      break;
    case 'fight': {
      b.mt += dt;

      if (b.mode === 'swoop') {
        const u = Math.min(1, b.mt / p.dur), yTop = lerp(p.y0, 90, u);

        if (u >= 1) dragonNext(b, ratio);
      } else if (b.mode === 'breath') {
        if (b.mt < 1.0) { b.x += (p.tx - b.x) * Math.min(1, dt * 3); b.y += (p.ty - b.y) * Math.min(1, dt * 3); }
        else {
          const want = Math.atan2(P.y - 30 - b.y, P.x - b.x);

            }
          } else { b.charge = 0; if (b.mt > 3.5) dragonNext(b, ratio); }
        }
      } else {   // balls: phun 3 quả cầu lửa bay vòng cung

        if (b.mt > 0.9) targetAng = Math.atan2(P.y - b.y, P.x - b.x);
        if (b.mt > 1.1 + b.balls * 0.4 && b.balls < 3) {
          b.balls++;

      }

      else if (L.state === 'on' && L.t <= 0) { L.state = 'off'; L.t = lerp(4.5, 10, ratio); }
      if (L.state === 'on' && Math.random() < dt * 30) fx.push({ type: 'fire', x: rnd(0, AW), y: FLOOR + 2, vx: rnd(-10, 10), vy: rnd(-140, -50), r: rnd(2, 4), life: rnd(0.3, 0.6), max: 0.6 });
      break;
    }
    case 'dying': {
      b.boomT -= dt;

    px = s.x; py = s.y;
  }
  if (targetAng === null) targetAng = Math.atan2(b.y - b.segs[0].y, b.x - b.segs[0].x);
  let da = targetAng - b.ang; while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283;
  b.ang += da * Math.min(1, dt * 10);

    let hit = overlap(pb, boxOf(b));
    for (const s of b.segs) if (!hit && overlap(pb, [s.x - s.r * 0.8, s.x + s.r * 0.8, s.y - s.r * 0.8, s.y + s.r * 0.8])) hit = true;

// ============ Luồng chơi: 10 màn (boss ở màn 5 và 10) ============
function startStage(i) {
  G.stage = i; G.pt = 0; G.marks.length = 0;
  const st = STAGES[i];
  if (st.layout !== undefined && st.layout !== layoutIdx) rearrangeTo(st.layout);
  G.lava = { state: 'off', t: 0 };
  if (st.boss) { G.phase = 'warning'; G.bossName = BOSSES[st.boss].name; G.bossSub = BOSSES[st.boss].sub; G.bossBar = 0; return; }
  G.phase = 'banner';
  G.groups = st.groups.map(g => g.slice());
  G.total = st.groups.reduce((a, g) => a + g.length, 0);
  G.spawnT = 1.6;
}
function remaining() { return G.groups.reduce((a, g) => a + g.length, 0) + mons.length + G.marks.length; }
function updateGame(dt) {
  G.pt += dt;
  if (!P.dead) G.time += dt;
  for (const k in G.cd) G.cd[k] = Math.max(0, G.cd[k] - dt);
  const st = STAGES[G.stage];
  if (!st.boss) {
    const bannerT = st.intro ? 2.4 : 1.6;
    if (G.phase === 'banner' && G.pt > bannerT) G.phase = 'fight';
    if (G.phase === 'banner' || G.phase === 'fight') {
      G.spawnT -= dt;
      if (G.groups.length && G.spawnT <= 0 && mons.length + G.marks.length < st.max) { spawnGroup(G.groups.shift(), st); G.spawnT = 1.5; }
      if (G.phase === 'fight' && !remaining() && !P.dead) {
        G.phase = 'clear'; G.pt = 0;
        const heal = Math.min(25, P.maxHp - P.hp);
        if (heal > 0) { P.hp += heal; pushNumbers(P, [{ v: heal, crit: false }], 'heal'); }
      }
    }
    if (G.phase === 'clear' && G.pt > 2.2) startStage(G.stage + 1);
  } else {
    if (G.phase === 'warning' && G.pt > 2.9) { G.phase = 'entrance'; G.pt = 0; st.boss === 'eye' ? spawnBoss() : spawnDragon(); }
    if (boss) boss.kind === 'boss' ? updateBoss(dt) : updateDragon(dt);
  }
  if (G.endT > 0) {
    G.endT -= dt;
    if (G.endT <= 0) { if (G.won) showEnd(true); else if (G.pickNext && !P.dead) showPick('boss'); else showEnd(false); }
  }
}

// Mỗi đòn = một cột số thẳng hàng sát trên đầu mục tiêu; các dòng hiện lần lượt từ dưới lên.
// Đòn mới luôn nằm sát đầu, đẩy cột cũ của cùng mục tiêu lên trên và cho cột cũ mờ nhanh.
// Cột của mục tiêu khác đứng sát bên thì dạt ngang để không đè nhau.

    dead: false, dashJump: false, lock: 0, oneShot: null, airSwings: 0, airJumps: 1, dropT: 0, djT: 0, wjT: 0, numT: 9, onGround: true, ground: null,
    shieldT: 0, blockCD: 0, whirlT: 0 });
  P.trail.length = 0;
  Object.assign(G, { stage: 0, phase: '', pt: 0, groups: [], total: 0, score: 0, kills: 0, killCount: 0, time: 0, skills: [], elem: null, cd: {},
    marks: [], lava: { state: 'off', t: 0 }, flash: 0, nameT: -1, bossBar: 0, endT: -1, won: false, pickNext: false });
  combo.hits = 0; combo.t = 0; shake = 0; hitstop = 0;
  setAnim('Idle', 0, 12, true);
}
document.getElementById('again').onclick = () => { endEl.hidden = true; resetGame(); showPick('start'); };

// ============ Bảng chỉnh thông số ============
const tuneEl = document.getElementById('tune');
function buildTune() {
  tuneEl.innerHTML = '';
  for (const [key, label, min, max, st] of TUNE) {
    const l = document.createElement('label');
    l.innerHTML = `${label} <b></b>`;
    const r = document.createElement('input');
    r.type = 'range'; r.min = min; r.max = max; r.step = st; r.value = T[key];
    const show = () => { l.querySelector('b').textContent = (+T[key]).toFixed(st < 1 ? 2 : 0); };
    r.addEventListener('input', () => { T[key] = +r.value; show(); if (key === 'btn') layoutControls(); save(); });
    show(); tuneEl.append(l, r);
  }
  const row = document.createElement('div'); row.className = 'row';
  const reset = document.createElement('button'); reset.textContent = 'Mặc định';
  reset.onclick = () => { Object.assign(T, DEFAULTS); save(); buildTune(); layoutControls(); };
  const close = document.createElement('button'); close.textContent = 'Đóng';
  close.onclick = () => { tuneEl.hidden = true; };
  row.append(reset, close); tuneEl.append(row);
}
function save() { try { localStorage.setItem('ksbt-tune', JSON.stringify(T)); } catch (e) {} }
document.getElementById('tuneBtn').onclick = () => { tuneEl.hidden = !tuneEl.hidden; if (!tuneEl.hidden) buildTune(); };
document.getElementById('fsBtn').onclick = () => {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (!req) return;
  try {
    const p = req.call(el);
    if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  } catch (e) {}
};

// ============ Khởi động ============
addEventListener('resize', resize);
function boot() {
  // Mở file:// với ảnh rời thì trình duyệt không cho đọc điểm ảnh -> chơi bình thường, chỉ không có kiếm nguyên tố.
  // Bản một-file (ảnh nhúng sẵn) và bản trên link claude.ai thì đọc được.
  try { bladeData = analyzeBlades(); } catch (e) { bladeData = null; console.warn('Không phân tích được lưỡi kiếm:', e); }
  resize();
  resetGame();
  document.getElementById('loading').remove();
  showPick('start');
  window.__dbg = { P, T, G, mons, orbs, combo, VAR, joy, ctrls, get boss() { return boss; }, startStage, resetGame, showPick, trySkill, spawnGroup, STAGES, dealDamage };
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
let pending = 0;
for (const name in ANIMS) {
  pending++;
  const img = new Image();
  img.onload = () => { IMG[name] = img; if (--pending === 0) boot(); };
  img.onerror = () => { document.getElementById('loading').textContent = 'Không tải được sprites/' + ANIMS[name].file; };
  // bản một-file nhúng sẵn ảnh vào window.SPRITE_DATA (xem build-standalone.py)
  img.src = (window.SPRITE_DATA && window.SPRITE_DATA[ANIMS[name].file]) || 'sprites/' + ANIMS[name].file;
}
</script>
