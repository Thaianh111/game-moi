<style>

<script>
// PROTOTYPE - NOT FOR PRODUCTION
// Question: 20 màn, 4 nhân vật, lướt chém, kỹ năng + hợp kích kiểu MOBA trên điện thoại có "đã tay" không?
// Date: 2026-11-03
'use strict';

// ============ Thông số chỉnh được (giá trị cứng, chỉnh bằng nút ⚙) ============
const T = {
  runSpeed: 165, groundAccel: 4200, airAccel: 3200,
  gravity: 1900, maxFall: 560,
  jumpV: 640, jumpCut: 0.45, coyote: 0.08, jumpBuffer: 0.12, djump: 0.86,
  dashSpeed: 340, dashTime: 0.32,
  wallSlide: 95, wallStick: 0.14, wallGrace: 7,
  wallJumpVx: 200, wallJumpVy: 600, wallJumpLock: 0.13,
  atkSpeed: 1.0, hitstop: 1.0, crit: 0.15, btn: 1.0, monSpeed: 1.0, monDmg: 1.0, skillCd: 1.0,
};
const DEFAULTS = Object.assign({}, T);
const TUNE = [
  ['runSpeed', 'Tốc độ chạy', 100, 260, 5],
  ['jumpV', 'Lực nhảy', 450, 820, 10],
  ['djump', 'Lực nhảy đôi (x)', 0.5, 1.2, 0.02],
  ['gravity', 'Trọng lực', 1200, 2800, 50],
  ['jumpCut', 'Nhả nút nhảy sớm (1 = không cắt)', 0.1, 1, 0.05],
  ['wallSlide', 'Tốc độ trượt tường', 30, 200, 5],
  ['wallJumpVx', 'Lực đạp tường ngang', 120, 340, 10],
  ['dashSpeed', 'Tốc độ lướt', 220, 480, 10],
  ['atkSpeed', 'Tốc độ chém (x)', 0.6, 1.8, 0.05],
  ['hitstop', 'Khựng hình (x)', 0, 2.5, 0.1],
  ['skillCd', 'Thời gian hồi chiêu (x)', 0.2, 2, 0.05],
  ['monSpeed', 'Tốc độ quái (x)', 0.5, 2, 0.05],
  ['monDmg', 'Sát thương quái (x)', 0, 3, 0.1],
  ['btn', 'Cỡ nút (x)', 0.7, 1.5, 0.05],
];
try {
  const saved = JSON.parse(localStorage.getItem('ksbt-tune') || '{}');
  for (const k in saved) if (k in T && typeof saved[k] === 'number') T[k] = saved[k];
} catch (e) { /* trình duyệt chặn localStorage thì dùng mặc định */ }

// ============ Sprite ============
const S = 0.75;                       // tỉ lệ vẽ: khung 128px -> nhân vật cao ~49 đơn vị
const ANIMS = {
  Idle: { file: 'idle.png', n: 16 }, Run: { file: 'run.png', n: 18 }, Jump: { file: 'jump.png', n: 6 },
  Landing: { file: 'landing.png', n: 16 }, WallJump: { file: 'walljump.png', n: 20 }, Slide: { file: 'slide.png', n: 16 },
  AttackSwing1: { file: 'attackswing1.png', n: 21 }, AttackSwing2: { file: 'attackswing2.png', n: 15 },
  AttackSwing3: { file: 'attackswing3.png', n: 24 }, Death: { file: 'death.png', n: 39 },
};
const IMG = {};
// Quái pixel (Legacy Fantasy - High Forest, Anokolisa) và boss quái thú phun lửa (x256p).
// fw/fh = cỡ khung, cols = số cột (mặc định 1 hàng), piv = điểm chân (quái bay: tâm thân),
// flip = hướng gốc của hình (-1 = quay trái, 1 = quay phải), px = ảnh pixel (vẽ không làm mịn).
const SPR = {};
const px48 = (src, n, piv) => ({ src: 'forest/' + src, fw: 48, fh: 32, n, piv: piv || [23, 32], flip: -1, px: true });
const px64 = (src) => ({ src: 'forest/' + src, fw: 64, fh: 64, n: 4, piv: [31, 30], flip: -1, px: true });
const bt = (src, cols, n) => ({ src: 'beast/' + src, fw: 340, fh: 255, cols, n, piv: [144, 240], flip: 1 });
const SHEETS = {
  'boar-walk': px48('boar-walk.png', 6), 'boar-run': px48('boar-run.png', 6), 'boar-idle': px48('boar-idle.png', 4), 'boar-hit': px48('boar-hit.png', 4),
  'boarb-run': px48('boarb-run.png', 6), 'boarb-hit': px48('boarb-hit.png', 4),
  'snail-walk': px48('snail-walk.png', 8, [25, 32]), 'snail-hide': px48('snail-hide.png', 8, [25, 32]),
  'snailg-walk': px48('snailg-walk.png', 8, [25, 32]), 'snailg-hide': px48('snailg-hide.png', 8, [25, 32]),
  'bee-fly': px64('bee-fly.png'), 'bee-attack': px64('bee-attack.png'), 'bee-hit': px64('bee-hit.png'),
  'beep-fly': px64('beep-fly.png'), 'beep-attack': px64('beep-attack.png'), 'beep-hit': px64('beep-hit.png'),
  'bt-appear': bt('appear.webp', 4, 23), 'bt-idle': bt('idle.webp', 5, 30), 'bt-walk': bt('walk.webp', 4, 20), 'bt-run': bt('run.webp', 4, 16),
  'bt-attack1': bt('attack1.webp', 4, 24), 'bt-attack2': bt('attack2.webp', 4, 24), 'bt-jump': bt('jump.webp', 4, 24),
  'bt-shout': bt('shout.webp', 5, 30), 'bt-hit': bt('hit.webp', 4, 16), 'bt-death': bt('death.webp', 6, 30),
  'bt-fire': { src: 'beast/fire.webp', fw: 680, fh: 510, cols: 5, n: 30, piv: [314, 479], flip: 1 },   // khung gấp đôi để chứa lửa
};

// ============ Kiếm nguyên tố: tách lưỡi kiếm khỏi da tay/mặt rồi tô màu theo kỹ năng ============
// Lưỡi kiếm và da đều trắng; lưỡi kiếm mảnh (bị bào mất khi co 3x3), da là mảng dày (còn lại).
// Mảng dày rất lớn là vệt chém trong khung tấn công nên vẫn tính là "kiếm".
const PAL = {
  fire: { lo: [214, 38, 8], mid: [255, 140, 26], hi: [255, 240, 170], glow: [255, 96, 20], glowMul: 2.6 },
  bolt: { lo: [24, 84, 235], mid: [70, 175, 255], hi: [232, 252, 255], glow: [70, 170, 255], glowMul: 2.4 },
  wave: { lo: [20, 150, 130], mid: [60, 215, 185], hi: [230, 255, 248], glow: [60, 220, 190], glowMul: 1.5 },
  ice: { lo: [30, 110, 200], mid: [110, 210, 255], hi: [240, 252, 255], glow: [120, 220, 255], glowMul: 2.2 },
  poison: { lo: [40, 120, 10], mid: [150, 240, 60], hi: [235, 255, 200], glow: [140, 255, 60], glowMul: 2.0 },
  light: { lo: [200, 140, 20], mid: [255, 220, 90], hi: [255, 255, 235], glow: [255, 220, 110], glowMul: 2.4 },
  blood: { lo: [110, 0, 10], mid: [225, 30, 45], hi: [255, 190, 190], glow: [255, 40, 50], glowMul: 2.2 },
  shadow: { lo: [30, 10, 60], mid: [120, 70, 210], hi: [225, 205, 255], glow: [130, 70, 240], glowMul: 2.0 },
  water: { lo: [10, 70, 180], mid: [60, 160, 255], hi: [220, 240, 255], glow: [60, 150, 255], glowMul: 2.0 },
  wood: { lo: [20, 100, 30], mid: [90, 210, 90], hi: [220, 255, 210], glow: [90, 230, 90], glowMul: 1.8 },
  earth: { lo: [100, 60, 20], mid: [190, 140, 80], hi: [250, 230, 190], glow: [210, 150, 70], glowMul: 1.6 },
  metal: { lo: [150, 110, 20], mid: [235, 205, 110], hi: [255, 250, 225], glow: [255, 220, 120], glowMul: 2.2 },
};
let bladeData = null;      // tên anim -> { W, H, src, blade, pts[frame] }
const VAR = {};            // nguyên tố -> tên anim -> { tint, glow }
function analyzeBlades() {
  const data = {};
  for (const name in ANIMS) {
    const img = IMG[name], n = ANIMS[name].n, W = img.width, H = img.height, N = W * H;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const src = g.getImageData(0, 0, W, H).data;   // ném lỗi nếu canvas bị "bẩn" (mở file:// với ảnh rời)
    const white = new Uint8Array(N), core = new Uint8Array(N);
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const r = src[p], gg = src[p + 1], b = src[p + 2];
      const mn = Math.min(r, gg, b), mx = Math.max(r, gg, b);
      if (src[p + 3] > 60 && mn > 140 && mx - mn < 40) white[i] = 1;
    }
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const fx0 = x % 128; if (fx0 === 0 || fx0 === 127) continue;
      const i = y * W + x;
      if (white[i] && white[i - 1] && white[i + 1] && white[i - W] && white[i + W] &&
          white[i - W - 1] && white[i - W + 1] && white[i + W - 1] && white[i + W + 1]) core[i] = 1;
    }
    const label = new Int32Array(N), areas = [0], stack = [];

// ============ Hợp kích: có 2 kỹ năng là mở chiêu đặc biệt (ô vàng, nạp năng lượng bằng đòn đánh) ============
// 2 kiếm nguyên tố -> lốc xoáy 2 màu (Lửa + Sét = Lôi Hỏa Long Quyển). Còn lại theo họ của kỹ năng không phải nguyên tố,
// nhuộm màu nguyên tố đang có.
const ENAME = { fire: 'Hỏa', bolt: 'Lôi', ice: 'Băng', wave: 'Phong', poison: 'Độc', light: 'Quang', blood: 'Huyết', shadow: 'Ám',
  water: 'Thủy', wood: 'Mộc', earth: 'Thổ', metal: 'Kim' };
const ENAME_ORDER = ['bolt', 'ice', 'water', 'shadow', 'light', 'metal', 'blood', 'poison', 'wood', 'earth', 'wave', 'fire'];
const byOrder = els => els.slice().sort((a, b) => ENAME_ORDER.indexOf(a) - ENAME_ORDER.indexOf(b));
// Tam Hợp Kích: chữ đuôi theo họ chiêu
const TRI = { tornado: 'Cửu Thiên Quyển', crescent: 'Phá Thiên Trảm', rain: 'Vạn Kiếm Quy Tông', meteor: 'Thiên Hỏa Lạc Tinh', quake: 'Liệt Địa Long Chấn', nova: 'Thánh Quang Thiên Bạo' };
const FAMS = {
  tornado: { name: e => `${ENAME[e] || 'Cuồng'} Phong Quyển`, icon: 'fu-tornado', desc: 'Lốc xoáy khổng lồ hút quái lại' },
  crescent: { name: e => `${ENAME[e] || 'Song'} Nguyệt Trảm`, icon: 'fu-crescent', desc: 'Nhát chém trăng khuyết khổng lồ xuyên màn hình' },
  rain: { name: e => `${ENAME[e] || 'Thần'} Kiếm Vũ`, icon: 'fu-rain', desc: '12 thanh kiếm thần cắm xuống quái' },
  meteor: { name: () => 'Thiên Thạch Vũ', icon: 'fu-meteor', desc: '12 thiên thạch rơi khắp đấu trường' },
  quake: { name: e => `${ENAME[e] || 'Địa'} Long Chấn`, icon: 'fu-quake', desc: 'Sóng chấn lớn khắp sàn, hất tung quái' },
  nova: { name: e => e === 'light' || !e ? 'Thánh Quang Bạo' : `${ENAME[e]} Quang Bạo`, icon: 'fu-nova', desc: 'Vụ nổ ánh sáng lớn, hồi 20 máu, bất tử 2 giây' },
};
const FAM_ORDER = ['tornado', 'crescent', 'rain', 'meteor', 'quake', 'nova'];
function fusionOf(skills) {
  if (skills.length < 2) return null;
  const elems = skills.filter(k => SKILLS[k].elem);
  if (skills.length >= 3) {   // Tam Hợp Kích
    const fs = FAM_ORDER.filter(f => skills.some(k => SKILLS[k].fam === f));
    if (elems.length >= 3) { const e = byOrder(elems.slice(0, 3)); return { tier: 3, kind: 'tri', mode: 'e3', elems: e, elem: e[2], name: `${e.map(k => ENAME[k]).join(' ')} Tam Nguyên Quyển`, icon: 'fu-tri', desc: '3 lốc xoáy 3 nguyên tố hội tụ, rồi Thiên Phạt giáng xuống' }; }
    if (elems.length === 2) { const e = byOrder(elems); return { tier: 3, kind: 'tri', mode: 'e2', elems: e, elem: e[1], fams: fs, name: `${ENAME[e[0]]} ${ENAME[e[1]]} ${TRI[fs[0]]}`, icon: 'fu-tri', desc: 'Lốc xoáy 2 nguyên tố + chiêu họ ' + fs[0] + ', rồi Thiên Phạt giáng xuống' }; }
    const e = elems[0] || null;
    return { tier: 3, kind: 'tri', mode: 'e1', elems: e ? [e] : [], elem: e, fams: fs.slice(0, 2), double: skills.includes('twin'), name: `${e ? ENAME[e] : 'Thiên'} ${TRI[fs[0]]}`, icon: 'fu-tri', desc: 'Ghép 2 chiêu hợp kích, rồi Thiên Phạt giáng xuống' };
  }
  if (elems.length >= 2) {
    const pair = elems.slice(0, 2).sort((a, b) => ENAME_ORDER.indexOf(a) - ENAME_ORDER.indexOf(b));
    return { name: `${ENAME[pair[0]]} ${ENAME[pair[1]]} Long Quyển`, icon: 'fu-pair', kind: 'tornado', elems: pair, elem: pair[1],
      desc: 'Lốc xoáy 2 nguyên tố, hút quái lại, đánh liên tục' };
  }
  const e = elems[0] || null, fams = skills.filter(k => !SKILLS[k].elem).map(k => SKILLS[k].fam);
  const fam = FAM_ORDER.find(f => fams.includes(f));
  const F = FAMS[fam];
  return { name: F.name(e), icon: F.icon, kind: fam, elems: e ? [e] : [], elem: e, double: has2(skills, 'twin'), desc: F.desc };
}
function has2(list, k) { return list.includes(k); }

function updatePlats(dt) {
  for (const p of plats) {

    if (p.moving) { p.t += dt; p.x = p.cx + Math.sin(p.t * 0.9) * p.amp; }
    else if (p.tw) {
      const w = p.tw; w.t = Math.min(1, w.t + dt / 0.7);
      const e = w.t < 0.5 ? 2 * w.t * w.t : 1 - Math.pow(-2 * w.t + 2, 2) / 2;
      p.x = w.fx + (w.tx - w.fx) * e; p.y = w.fy + (w.ty - w.fy) * e; p.w = w.fw + (w.tw - w.fw) * e;

    p.dx = p.x - ox; p.dy = p.y - oy; p.glow = Math.max(0, p.glow - dt * 1.1);

}

function boxOf(t) {

  for (const at of list) {

function moveBody(b, dt, isPlayer) {
  const prevL = b.x - b.w / 2, prevR = b.x + b.w / 2;
  b.x += b.vx * dt;
  b.hitWall = 0;
  for (const s of solids) {
    if (s.playerOnly && !isPlayer) continue;
    const L = b.x - b.w / 2, R = b.x + b.w / 2, top = b.y - b.h, bot = b.y;
    if (bot > s.y && top < s.y + s.h && R > s.x && L < s.x + s.w) {
      if (prevR <= s.x + 0.5) { b.x = s.x - b.w / 2; b.hitWall = 1; }
      else if (prevL >= s.x + s.w - 0.5) { b.x = s.x + s.w + b.w / 2; b.hitWall = -1; }
      if (b.hitWall) { b.wallVx = b.vx; b.vx = 0; }
    }
  }
  const prevBot = b.y;
  b.y += b.vy * dt;
  b.onGround = false; b.ground = null;
  const L = b.x - b.w / 2, R = b.x + b.w / 2;
  for (const s of solids) {
    if (s.playerOnly && !isPlayer) continue;
    if (b.y > s.y && b.y - b.h < s.y + s.h && R > s.x && L < s.x + s.w) {
      if (b.vy >= 0 && prevBot <= s.y + 0.5) { b.impactVy = b.vy; b.y = s.y; b.vy = 0; b.onGround = true; b.ground = s; }
      else if (b.vy < 0) { b.y = s.y + s.h + b.h; b.vy = 0; }
    }
  }
  if (!b.onGround && b.vy >= 0 && !(b.dropT > 0)) {
    for (const p of plats) {
      if (prevBot <= p.y + 0.5 && b.y >= p.y && R > p.x && L < p.x + p.w) { b.impactVy = b.vy; b.y = p.y; b.vy = 0; b.onGround = true; b.ground = p; break; }
    }
  }
}
function carry(b) { if (b.ground && b.ground.dx !== undefined) { b.x += b.ground.dx; b.y += b.ground.dy; } }
function wallSideOf(b, dist) {
  const top = b.y - b.h + 4, bot = b.y - 4;
  for (const s of solids) {
    if (!s.wall || !(bot > s.y && top < s.y + s.h)) continue;
    const L = b.x - b.w / 2, R = b.x + b.w / 2;
    if (L >= s.x + s.w - 0.5 && L - (s.x + s.w) <= dist) return -1;
    if (R <= s.x + 0.5 && s.x - R <= dist) return 1;
  }
  return 0;
}

// ============ Mỗi lần chơi một khác: thứ tự boss, bố cục bục, đội hình quái ============
const BOSS_KINDS = ['eye', 'beast', 'lord', 'lordx'], BOSS_STAGES = [4, 9, 14, 19];

// thứ tự boss mới không để con nào đứng lại đúng chỗ của lần chơi trước
function rollBossOrder() {
  let last = []; try { last = JSON.parse(localStorage.getItem('ksbt-boss') || '[]'); } catch (e) {}
  let o, n = 0;
  do { o = shuffle(BOSS_KINDS.slice()); n++; } while (n < 60 && last.length === 4 && o.some((k, i) => k === last[i]));
  try { localStorage.setItem('ksbt-boss', JSON.stringify(o)); } catch (e) {}

function bossKindAt(i) { const k = BOSS_STAGES.indexOf(i); return k < 0 ? null : G.bossOrder[k]; }

      if (fresh && cands.includes(fresh) && Math.random() < 0.35) type = fresh;

function rollRun() {
  G.bossOrder = rollBossOrder();

  STAGES.forEach((st, i) => {
    const kind = bossKindAt(i);
    let L;
    if (kind === 'beast' || kind === 'lordx') L = 4;
    else { do L = NORMAL_LAYOUTS[Math.floor(Math.random() * NORMAL_LAYOUTS.length)]; while (L === prev); }

// ============ Luồng chơi: 20 màn (boss ở màn 5, 10, 15, 20) ============

      p.x += dx / d * Math.min(d, sp * dt); p.y += dy / d * Math.min(d, sp * dt);

      ctx.fillStyle = '#b07a10'; ctx.beginPath(); ctx.ellipse(p.x, p.y, w + 0.8, 5, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#ffd45a'; ctx.beginPath(); ctx.ellipse(p.x, p.y, w, 4.2, 0, 0, 6.29); ctx.fill();
    } else {
      const R = RARITY[p.item.rar];
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 26); g.addColorStop(0, R.col); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.6 + Math.sin(time * 8) * 0.2; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, 6.29); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.fillRect(p.x - 2, p.y - 80, 4, 80);

}

// ---- icon trang bị vẽ bằng code (theo ô + màu hệ + viền độ hiếm) ----
const ICON_CACHE = {};
function itemIcon(it) {
  const key = `${it.slot}-${it.theme}-${it.rar}`;
  if (ICON_CACHE[key]) return ICON_CACHE[key];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), col = THEMES[it.theme][1], R = RARITY[it.rar];
  const bg = g.createRadialGradient(32, 32, 4, 32, 32, 34); bg.addColorStop(0, R.col + '55'); bg.addColorStop(1, '#0c0f18');
  g.fillStyle = bg; g.fillRect(0, 0, 64, 64);
  g.lineWidth = 2; g.strokeStyle = '#1a1206'; g.fillStyle = col;
  const P2 = pts => { g.beginPath(); pts.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](x, y)); g.closePath(); g.fill(); g.stroke(); };
  if (it.slot === 'weapon') { P2([[46, 10], [54, 10], [54, 18], [24, 46], [18, 40]]); g.fillStyle = '#8a5a20'; P2([[14, 38], [26, 50], [22, 54], [10, 42]]); g.fillStyle = '#c8a040'; P2([[8, 50], [14, 56], [10, 60], [4, 54]]); }
  else if (it.slot === 'helm') { g.beginPath(); g.arc(32, 36, 18, Math.PI, 0); g.lineTo(50, 44); g.lineTo(14, 44); g.closePath(); g.fill(); g.stroke(); g.fillStyle = '#1a1206'; g.fillRect(20, 38, 24, 3); g.fillStyle = col; P2([[32, 6], [36, 18], [28, 18]]); }
  else if (it.slot === 'armor') { P2([[18, 12], [26, 16], [38, 16], [46, 12], [56, 22], [48, 28], [46, 54], [18, 54], [16, 28], [8, 22]]); g.strokeStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.moveTo(32, 18); g.lineTo(32, 52); g.stroke(); }
  else if (it.slot === 'glove') { P2([[20, 54], [20, 28], [24, 14], [30, 14], [30, 26], [34, 12], [40, 12], [40, 26], [44, 18], [50, 20], [46, 40], [44, 54]]); }
  else if (it.slot === 'boots') { P2([[20, 8], [36, 8], [36, 38], [54, 46], [54, 56], [14, 56], [16, 40]]); }
  else { g.strokeStyle = '#c8a040'; g.beginPath(); g.moveTo(20, 6); g.quadraticCurveTo(32, 26, 44, 6); g.stroke(); g.strokeStyle = '#1a1206'; g.beginPath(); g.arc(32, 38, 16, 0, 6.29); g.fill(); g.stroke(); g.fillStyle = '#0c0f18'; g.beginPath(); g.arc(32, 38, 6, 0, 6.29); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(24, 24, 3, 0, 6.29); g.fill();
  g.lineWidth = 3; g.strokeStyle = R.col; g.strokeRect(1.5, 1.5, 61, 61);
  return (ICON_CACHE[key] = c);
}
function itemIconURL(it) { return itemIcon(it).toDataURL(); }

// ---- ngoại hình theo trang bị (vẽ thêm lên nhân vật trong trận và trong sảnh) ----
// Áo: phủ màu lên thân; Mũ: vương miện / sừng lơ lửng trên đầu; Vũ khí: vệt chém + đốm sáng; Găng: tia lửa khi chém trúng;
// Giày: vệt sáng dưới chân khi chạy / lướt; Ngọc bội: vòng hào quang dưới chân.
function drawHelm(g, x, y, col, rar, time, s) {
  g.save(); g.translate(x, y + Math.sin(time * 3) * 1.5 * s); g.scale(s, s);
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.5;
  const gl = g.createRadialGradient(0, 0, 1, 0, 0, 14); gl.addColorStop(0, col); gl.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(0, 0, 14, 0, 6.29); g.fill();
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.fillStyle = col; g.strokeStyle = '#1a1206'; g.lineWidth = 1;
  g.beginPath();
  if (rar >= 2) { g.moveTo(-9, 3); g.lineTo(-9, -3); g.lineTo(-5, 0); g.lineTo(0, -8); g.lineTo(5, 0); g.lineTo(9, -3); g.lineTo(9, 3); }   // vương miện
  else { g.moveTo(-8, 2); g.quadraticCurveTo(-10, -6, -4, -9); g.lineTo(-4, -1); g.lineTo(4, -1); g.lineTo(4, -9); g.quadraticCurveTo(10, -6, 8, 2); }   // sừng
  g.closePath(); g.fill(); g.stroke();
  g.restore();
}
function drawCharmRing(g, x, y, col, time, s) {
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = col; g.fillStyle = col; g.globalAlpha = 0.55; g.lineWidth = 1.3 * s;
  g.beginPath(); g.ellipse(x, y, 22 * s, 5 * s, 0, 0, 6.29); g.stroke();
  for (let i = 0; i < 4; i++) { const a = time * 2 + i * 1.57; g.beginPath(); g.arc(x + Math.cos(a) * 22 * s, y + Math.sin(a) * 5 * s, 1.8 * s, 0, 6.29); g.fill(); }
  g.restore();
}
// nhân vật có quầng màu áo: vẽ đè một lớp phủ màu lên đúng khung hình (dùng canvas tạm)
function armorOverlay(name, fi, x, y, face, scale, col, alpha) {
  const img = ANIMS[name] ? IMG[name] : SPR[name]; if (!img) return;
  const m = ANIMS[name] ? { fw: 128, fh: 128, piv: [64, 100], n: ANIMS[name].n } : SHEETS[name];
  fi = clamp(Math.floor(fi), 0, m.n - 1);
  t2.globalCompositeOperation = 'source-over'; t2.clearRect(0, 0, m.fw, m.fh);
  t2.drawImage(img, fi * m.fw, 0, m.fw, m.fh, 0, 0, m.fw, m.fh);
  t2.globalCompositeOperation = 'source-atop'; t2.fillStyle = col; t2.globalAlpha = 0.3; t2.fillRect(0, 0, m.fw, m.fh); t2.globalAlpha = 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(face * scale, scale); if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = !m.px;
  ctx.drawImage(tint2, 0, 0, m.fw, m.fh, -m.piv[0], -m.piv[1], m.fw, m.fh);
  ctx.restore(); ctx.imageSmoothingEnabled = true;
}
function headY() { return P.y - (CH.kind === 'ebros' ? 58 : 54); }
function drawGearOnPlayer(time) {
  const L = G.look || {};
  if (P.dead) return;
  if (L.charm) drawCharmRing(ctx, P.x, P.y, L.charm.col, time, 1);
  if (L.helm) drawHelm(ctx, P.x, headY(), L.helm.col, L.helm.rar, time, 0.9);
}
function gearTick(dt) {   // hạt theo trang bị: giày và vũ khí
  const L = G.look || {};
  if (P.dead) return;
  if (L.boots && P.onGround && (Math.abs(P.vx) > 120 || P.state === 'dash' || P.state === 'dslash') && Math.random() < dt * 40)
    fx.push({ type: 'mote', x: P.x + rnd(-6, 6), y: P.y - 2, vx: -P.vx * 0.1, vy: rnd(-40, -10), r: rnd(1.5, 2.6), col: L.boots.col, g: 0, life: 0.35, max: 0.35 });
  if (L.weapon && L.weapon.rar >= 1 && Math.random() < dt * (isAttacking() ? 30 : 6)) {
    const p = weaponPoint(); if (p) fx.push({ type: 'mote', x: p[0], y: p[1], vx: rnd(-20, 20), vy: rnd(-40, 0), r: rnd(1, 2), col: L.weapon.col, g: 0, life: 0.3, max: 0.3 });
  }

// ============ Sảnh chính ============
const lobbyEl = document.getElementById('lobby'), lbBody = document.getElementById('lbBody');

function lbButton(txt, cls, fn) { const b = document.createElement('button'); b.className = cls; b.textContent = txt; b.onclick = e => { e.stopPropagation(); fn(); }; return b; }
function itemRow(it, actions) {
  const R = RARITY[it.rar], d = document.createElement('div'); d.className = 'irow';

function statLines(ch) {
  const c = CHARS[ch], e = eqStats(ch);
  const rows = [['Máu', 100, e.hp, ''], ['Công', 100, e.atk, '%'], ['Chí mạng', Math.round((T.crit + c.crit) * 100), e.crit, '%'],
    ['Tốc đánh', Math.round(c.aspd * 100), e.aspd, '%'], ['Tốc chạy', Math.round(c.spd * 100), e.spd, '%'], ['Giảm sát thương', 0, e.def, '%'],
    ['Lướt xa', Math.round(c.dash * 100), e.dash, '%'], ['Hút máu', 0, e.ls, '%'], ['Giảm hồi chiêu', 0, e.cdr, '%'], ['Nạp hợp kích', 100, e.en, '%']];
  const f = (v, u) => u ? +v.toFixed(1) : Math.round(v);
  return rows.map(([n, b, add, u]) => `<div class="srow"><span>${n}</span><b>${f(b + add, u)}${u}</b>${add ? `<i>+${f(add, u)}</i>` : ''}</div>`).join('');
}
function renderLobby() {
  document.getElementById('lbGold').textContent = SAVE.gold.toLocaleString('vi-VN');
  for (const b of document.querySelectorAll('#lobby .tabs button')) b.classList.toggle('on', b.dataset.tab === lbTab);
  lbBody.innerHTML = ''; lbBody.className = 'lb-body tab-' + lbTab;
  const ch = SAVE.char;
  if (lbTab === 'char') {
    const left = document.createElement('div'); left.className = 'chars';
    for (const key in CHARS) {

      b.append(portraitCanvas(CHARS[key])); b.insertAdjacentHTML('beforeend', `<span>${CHARS[key].name}</span>`);

    mid.insertAdjacentHTML('beforeend', `<div class="cname">${CHARS[ch].name}<small>${CHARS[ch].desc}</small></div>`);
    const right = document.createElement('div'); right.className = 'panel';
    if (!lbSlot) right.innerHTML = `<h3>Chỉ số</h3>${statLines(ch)}<p class="hint">Chạm vào ô trang bị để mặc, nâng cấp hoặc tháo.</p>`;
    else {
      right.innerHTML = `<h3>${SLOTNAME[lbSlot]}</h3>`;
      const cur = eq[lbSlot];
      if (cur) {
        const acts = [];
        if (cur.lv < 10) acts.push(lbButton(`Nâng cấp ${upCost(cur)}🪙`, 'mini gold' + (SAVE.gold < upCost(cur) ? ' off' : ''), () => { if (SAVE.gold < upCost(cur)) return; SAVE.gold -= upCost(cur); cur.lv++; saveSave(); renderLobby(); }));
        acts.push(lbButton('Tháo', 'mini', () => { delete SAVE.equip[ch][lbSlot]; saveSave(); renderLobby(); }));
        right.append(itemRow(cur, acts));
      } else right.insertAdjacentHTML('beforeend', '<p class="hint">Chưa mặc gì.</p>');
      const list = SAVE.inv.filter(i => i.slot === lbSlot && (!cur || i.id !== cur.id)).sort((a, b) => b.rar - a.rar || b.lv - a.lv);
      right.insertAdjacentHTML('beforeend', `<h4>Trong túi (${list.length})</h4>`);

      if (!list.length) right.insertAdjacentHTML('beforeend', '<p class="hint">Hạ quái tinh anh / boss để nhặt đồ, hoặc mua ở Cửa hàng.</p>');

      if (!w) acts.push(lbButton(`Bán ${sellPrice(it)}🪙`, 'mini gold', () => { SAVE.inv = SAVE.inv.filter(i => i !== it); SAVE.gold += sellPrice(it); saveSave(); renderLobby(); }));
      box.append(itemRow(it, acts));

    lbBody.append(box);
  } else {
    const box = document.createElement('div'); box.className = 'list';
    box.append(lbButton('Làm mới cửa hàng 30🪙', 'mini gold refresh' + (SAVE.gold < 30 ? ' off' : ''), () => { if (SAVE.gold < 30) return; SAVE.gold -= 30; refreshShop(); saveSave(); renderLobby(); }));
    for (const it of SAVE.shop) {
      const price = RARITY[it.rar].price;
      box.append(itemRow(it, [lbButton(`Mua ${price}🪙`, 'mini gold' + (SAVE.gold < price ? ' off' : ''), () => {
        if (SAVE.gold < price) return;
        SAVE.gold -= price; SAVE.inv.push(it); SAVE.shop = SAVE.shop.filter(i => i !== it);
        const cur = equippedOf(ch)[it.slot]; if (!cur) equipItem(ch, it);   // ô trống thì mặc luôn

    lbBody.append(box);
  }
}
// xem trước nhân vật với trang bị (đứng thở, quầng, mũ, vòng ngọc bội)
function lobbyLoop(now) {
  if (lobbyEl.hidden) return;
  const c = document.getElementById('lbPreview');
  if (c) try {
    const g = c.getContext('2d'), time = now / 1000, ch = CHARS[SAVE.char], L = lookOf(SAVE.char);
    g.clearRect(0, 0, c.width, c.height);
    const bgG = g.createRadialGradient(220, 250, 20, 220, 250, 220); bgG.addColorStop(0, 'rgba(255,214,140,.22)'); bgG.addColorStop(1, 'rgba(255,214,140,0)');
    g.fillStyle = bgG; g.fillRect(0, 0, 440, 400);
    g.fillStyle = 'rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(220, 340, 70, 12, 0, 0, 6.29); g.fill();
    if (L.charm) drawCharmRing(g, 220, 340, L.charm.col, time, 3);
    const sc = ch.kind === 'ebros' ? 3.2 : 2.6, anim = ch.anims.idle, name = anim[0], m = ANIMS[name] ? { fw: 128, fh: 128, piv: [64, 100], n: ANIMS[name].n } : SHEETS[name];
    const img = ANIMS[name] ? IMG[name] : SPR[name], fi = anim[1] + Math.floor(time * (anim[3] || 8)) % (anim[2] - anim[1] + 1);
    if (L.weapon) { const wg = g.createRadialGradient(220, 250, 10, 220, 250, 120); wg.addColorStop(0, L.weapon.col + '66'); wg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = wg; g.fillRect(80, 110, 280, 260); }
    if (img) {
      g.save(); g.translate(220, 340); g.scale(sc, sc); g.imageSmoothingEnabled = !!ANIMS[name];
      g.drawImage(img, fi * m.fw, 0, m.fw, m.fh, -m.piv[0], -m.piv[1], m.fw, m.fh); g.restore();
      if (L.armor) {   // phủ màu áo
        t2.globalCompositeOperation = 'source-over'; t2.clearRect(0, 0, m.fw, m.fh); t2.drawImage(img, fi * m.fw, 0, m.fw, m.fh, 0, 0, m.fw, m.fh);
        t2.globalCompositeOperation = 'source-atop'; t2.globalAlpha = 0.3; t2.fillStyle = L.armor.col; t2.fillRect(0, 0, m.fw, m.fh); t2.globalAlpha = 1;
        g.save(); g.translate(220, 340); g.scale(sc, sc); g.imageSmoothingEnabled = !!ANIMS[name]; g.drawImage(tint2, 0, 0, m.fw, m.fh, -m.piv[0], -m.piv[1], m.fw, m.fh); g.restore();
      }
    }
    if (L.helm) drawHelm(g, 220, 340 - (ch.kind === 'ebros' ? 58 / S : 54 / ch.scale) * sc, L.helm.col, L.helm.rar, time, 2.4);
    if (L.boots) { g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 6; i++) { const ph = (time * 0.8 + i / 6) % 1; g.globalAlpha = 1 - ph; g.fillStyle = L.boots.col; g.beginPath(); g.arc(200 + i * 8, 338 - ph * 30, 3, 0, 6.29); g.fill(); } g.restore(); }
    if (L.glove) { g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.6 + Math.sin(time * 6) * 0.2; const gg = g.createRadialGradient(250, 270, 1, 250, 270, 18); gg.addColorStop(0, L.glove.col); gg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gg; g.beginPath(); g.arc(250, 270, 18, 0, 6.29); g.fill(); g.restore(); }
  } catch (e) { loopError('lobby', e); }

}

function boot() {

  document.getElementById('loading').remove();
  if (location.hash === '#banner') exportBanner();

  window.__dbg = { P, T, G, mons, orbs, combo, VAR, joy, ctrls, get boss() { return boss; }, startStage, resetGame, showPick, trySkill, tryFusion, spawnGroup, STAGES, dealDamage, SPR, CHARS,
    setChar(k) { G.char = k; CH = CHARS[k]; resetGame(); }, fusionOf, vortices, zones, pets, shots, SKILLS, rollRun, bossKindAt, MON, react, buildPower, pressure, showTitle, fusionOf2: fusionOf, get SAVE() { return SAVE; }, set SAVE(v) { SAVE = v; }, showLobby, showEnd, makeItem, equipItem, pickups, eqStats, commitRun, refreshShop, newSave, renderLobby };
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
// tải ảnh: nhân vật (IMG, dùng để tách lưỡi kiếm) + quái/boss (SPR). Bản một-file nhúng sẵn ảnh vào
// window.SPRITE_DATA (xem build-standalone.py), bản thường thì đọc từ thư mục sprites/
const jobs = [];
for (const name in ANIMS) jobs.push([ANIMS[name].file, img => { IMG[name] = img; }]);
for (const key in SHEETS) jobs.push([SHEETS[key].src, img => { SPR[key] = img; }]);
let pending = jobs.length;
const loadEl = document.getElementById('loading');
for (const [file, put] of jobs) {
  const img = new Image();
  img.onload = () => { put(img); pending--; if (loadEl.isConnected) loadEl.textContent = `Đang tải… ${jobs.length - pending}/${jobs.length}`; if (pending === 0) boot(); };
  img.onerror = () => { loadEl.textContent = 'Không tải được sprites/' + file; };
  img.src = (window.SPRITE_DATA && window.SPRITE_DATA[file]) || 'sprites/' + file;
}
